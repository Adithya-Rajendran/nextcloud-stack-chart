# nextcloud-stack — default values.
#
# Security-first: images default to Docker Hardened Images (DHI, dhi.io) — minimal,
# non-root, CVE-scanned. The dhi.io images just need a FREE Docker account (not a
# paid subscription); the default install authenticates with an imagePullSecret
# (see imagePullSecrets below).
#
# Prefer plain Docker Hub images (no dhi.io login)? Use the bundled overlay:
#   -f values-public.yaml   public images on Docker Hub, no pull secret needed.
#
# Most users override a small subset in a `-f my-values.yaml` file. See
# `example-values.yaml` for a realistic config.
#
# SECURITY MODEL
# --------------
# Secrets are EXTERNAL ONLY. Pre-create them with `scripts/bootstrap-secrets.sh`
# and reference them via `*.auth.existingSecret`. The chart does not auto-generate
# passwords and does not accept inline password values — both patterns leak
# plaintext into Helm release metadata. See README.md "Secret management".

# -----------------------------------------------------------------------------
# Global / cross-cutting
# -----------------------------------------------------------------------------
nameOverride: ""
fullnameOverride: ""

# Common labels added to every resource.
commonLabels: {}

# Image-pull secrets. The default DHI images live on dhi.io and need one — a FREE
# Docker account is enough (no paid subscription). Create it and reference it here:
#   kubectl -n <ns> create secret docker-registry dhi-pull \
#     --docker-server=dhi.io --docker-username=<user> \
#     --docker-password='<docker-pat>' --docker-email=<email>
# Not needed when using -f values-public.yaml.
imagePullSecrets: []
# - name: dhi-pull

# Spread the stack's core single-replica workloads (nextcloud, postgres, valkey,
# clamav) across nodes so a single node failure can't take everything down at
# once. Rendered as a pod anti-affinity that selects the shared name+instance
# labels every stack Pod carries, so each component repels every other across
# spread.topologyKey. Whiteboard spreads its OWN replicas separately (see
# whiteboard.topologySpreadConstraints).
spread:
  # Master switch. On by default — in the soft mode below it only ever changes
  # WHERE pods land, never whether they schedule.
  enabled: true
  # Soft by default (preferredDuringScheduling): on a cluster with fewer nodes
  # than these workloads the scheduler still places every pod, just packing where
  # it must — a 3-node cluster keeps scheduling. Set true for a HARD guarantee
  # (requiredDuringScheduling): pods that can't be spread go Pending. Only sensible
  # with enough schedulable nodes (>= 4 to place all four core workloads).
  required: false
  # Failure domain to spread across. kubernetes.io/hostname = per-node (the
  # single-node-failure case). Use topology.kubernetes.io/zone to spread across
  # AZs instead (needs zone-labeled nodes).
  topologyKey: kubernetes.io/hostname
  # Preference strength for the soft rule (1-100). Ignored when required: true.
  weight: 100

# -----------------------------------------------------------------------------
# Nextcloud (php-fpm + nginx)
# -----------------------------------------------------------------------------
nextcloud:
  # -- PHP-FPM container (the only custom image in the chart; public on GHCR).
  image:
    registry: ghcr.io
    repository: adithya-rajendran/nextcloud-fpm
    tag: 33.0.5-fpm
    # Pin via scripts/pin-digests.sh (overrides tag when set).
    digest: ""
    pullPolicy: IfNotPresent

  # -- nginx sidecar (DHI nginx, runs as nonroot UID 65532). Listens on 8080 and
  # talks to 127.0.0.1:9000 over loopback. `1-compat` (not `:1`) keeps a shell in
  # the image. The public overlay swaps this for nginxinc/nginx-unprivileged.
  web:
    image:
      registry: dhi.io
      repository: nginx
      tag: 1-compat
      # Pin via scripts/pin-digests.sh (overrides tag when set).
      digest: ""
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 1
        memory: 256Mi
    # Real client IP handling. nginx rewrites the connection's source address
    # from a forwarded header, but ONLY when the request arrives from a trusted
    # CIDR (set_real_ip_from). Leave trustedCidrs empty to disable the rewrite
    # entirely (Nextcloud then sees the proxy IP — never spoofable).
    realIp:
      # Behind a standard ingress controller / gateway / reverse proxy use the
      # multi-valued X-Forwarded-For (recursive MUST be true). The Cloudflare
      # addon (cloudflare.enabled) overrides this to the single-valued
      # CF-Connecting-IP with recursive off.
      header: X-Forwarded-For
      # Walk X-Forwarded-For right-to-left, skipping trusted proxies, to find the
      # real client. Required for multi-valued headers — the chart fails render
      # if a multi-valued header is paired with recursive: false (spoofable).
      recursive: true
      # CIDR(s) trusted to set the real-IP header — your proxy's source range
      # (ingress controller / gateway / cloudflared pods). A list. Empty disables
      # real-IP rewriting. Find your pod CIDR with:
      #   kubectl get nodes -o jsonpath='{.items[*].spec.podCIDR}'
      trustedCidrs: []
      # - 10.0.0.0/8
    # TLS is terminated upstream (ingress, gateway, or cloudflared) and the
    # origin Pod sees plain HTTP. Force HTTPS=on to PHP-FPM so Nextcloud sets the
    # Secure cookie flag and emits https:// URLs. Set false only for a plain-HTTP
    # end-to-end install (not recommended).
    httpsBehindProxy: true

    # Loopback self-connection. Nextcloud's "connect to itself" setup checks
    # (WebDAV, .well-known, .mjs/.otf, OCS provider, security headers) require the
    # Pod to HTTP-reach its OWN public URL. Some proxies/CNIs can't hairpin the
    # backend Pod back to itself through the external entrypoint (e.g. the Cilium
    # Gateway returns 403 on that self-loop), which makes those checks fail even
    # though the features work for real clients. When enabled, nginx adds an
    # internal HTTPS listener on :443 (needs NET_BIND_SERVICE — auto-added to the
    # web container) using tlsSecret, and a hostAlias points settings.overwriteHost
    # at 127.0.0.1 so ONLY self-requests resolve to the local nginx. Nothing
    # external changes (the Service/gateway still use the plain listener).
    selfConnect:
      enabled: false
      # kubernetes.io/tls Secret in THIS namespace, valid for settings.overwriteHost
      # and trusted by the php image's CA bundle (e.g. a cert-manager Let's Encrypt
      # cert). REQUIRED when enabled. Assumes settings.overwriteProtocol: https.
      tlsSecret: ""

  replicas: 1
  # Shared RWO PVCs between the fpm + nginx containers (same Pod) ⇒ Recreate;
  # a rolling update would Multi-Attach the volume. Keep Recreate on any RWO SC.
  strategy:
    type: Recreate

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

  # php-fpm pool sizing (rendered into zz-nextcloud.conf). The image's stock
  # pool caps at pm.max_children = 5 — a handful of DAV sync clients saturates
  # that and queues every other request behind them while CPU idles. Worst-case
  # memory ≈ maxChildren × ~120-150MB; keep under resources.limits.memory.
  phpFpm:
    maxChildren: 12
    startServers: 4
    minSpareServers: 2
    maxSpareServers: 8
    # Recycle each worker after N requests (bounds slow extension leaks).
    maxRequests: 500

  podAnnotations: {}
  podLabels: {}

  # Pod-level security context. fsGroup 33 = www-data so fpm can write
  # the shared webroot and nginx can mount it readOnly.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 33
    runAsGroup: 33
    fsGroup: 33
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  # Per-container security contexts.
  containerSecurityContext:
    php:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false   # fpm writes to a few places in the rootfs
      runAsNonRoot: true
      runAsUser: 33
      runAsGroup: 33
      capabilities:
        drop: ["ALL"]
    web:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65532    # dhi.io/nginx 'nonroot' user (UID 65532)
      runAsGroup: 65532
      capabilities:
        drop: ["ALL"]

  # PodDisruptionBudget — documents intent during voluntary disruptions
  # (node drain, cluster upgrade). With 1 replica + maxUnavailable: 0, drain
  # operations require explicit --force or PDB deletion. Set enabled: false
  # for dev/test clusters where uninterrupted nightly drains are fine.
  pdb:
    enabled: true
    maxUnavailable: 0

  # Service in front of the Pod's nginx container. Stays ClusterIP — an Ingress,
  # Gateway API HTTPRoute, or the Cloudflare addon fronts it. Switch to
  # LoadBalancer/NodePort only if you expose the Service directly.
  service:
    type: ClusterIP
    port: 80
    # Must match the nginx listener inside the pod (8080).
    targetPort: 8080
    annotations: {}

  # Persistence. accessModes is a list for K8s API shape, but the fpm + nginx
  # containers share the PVC inside ONE Pod, so ReadWriteOnce is correct and
  # works on any provisioner. RWX is not required.
  persistence:
    webroot:
      size: 10Gi
      # Empty ⇒ the cluster's default StorageClass. Set explicitly to pin one
      # (e.g. a retain-policy class so data survives uninstall).
      storageClassName: ""
      accessModes: ["ReadWriteOnce"]
      # Existing PVC name to mount instead of creating new (migration handle).
      existingClaim: ""
    data:
      size: 100Gi
      storageClassName: ""
      accessModes: ["ReadWriteOnce"]
      existingClaim: ""

  # Admin user. The existingSecret is required (created by scripts/bootstrap-secrets.sh).
  # Secret keys expected: `admin-user` (the username), `admin-password`.
  admin:
    existingSecret: ""    # REQUIRED — name of pre-created K8s Secret

  # Server-side settings (templated into a config.php overlay).
  settings:
    # Public-facing hostname. Change to your domain. Used everywhere Nextcloud
    # emits its own URLs.
    overwriteHost: nextcloud.example.com
    overwriteProtocol: https
    overwriteCliUrl: ""   # auto-derived from overwriteHost+Protocol if empty
    trustedDomains:
      - localhost
      - nextcloud.example.com
    defaultPhoneRegion: US
    # Allow SERVER-SIDE HTTP requests to private/LAN addresses (Nextcloud blocks
    # them by default). Required when a backend the server itself calls — e.g. an
    # OIDC IdP (sso.provider.discoveryUri), S3, or Collabora — resolves to an
    # RFC1918 IP such as an in-cluster gateway VIP. Rendered into
    # zz-chart.config.php as `allow_local_remote_servers`.
    allowLocalRemoteServers: false
    maintenanceWindowStart: 11
    # Upload / memory tuning.
    maxFileUploadSize: 16G
    memoryLimit: 512M
    # OPcache sizing (rendered into zz-chart-opcache.ini, which loads after the
    # image's opcache-recommended.ini — overrides placed in customPhp would
    # silently lose to it). The live webroot+apps tree now holds ~17.9k PHP
    # files (measured: find /var/www/html -name '*.php' | wc -l = 17918), which
    # EXCEEDS the previous 16384 slot cap — so hot scripts were being evicted
    # and recompiled per-request, adding compile latency that compounds every
    # cold start. 32531 (prime, the standard large-NC recommendation) covers the
    # current set with headroom; 256MB holds the compiled bytecode. JIT buffer
    # matches the upstream-recommended 8M (Nextcloud uses <2MiB of it; bigger
    # buys nothing).
    opcache:
      memoryConsumption: 256
      internedStringsBuffer: 32
      maxAcceleratedFiles: 32531
      jitBufferSize: 8M
    # PHP custom.ini settings — keep the security defaults.
    customPhp: |
      ; Force Secure flag on session cookies — Nextcloud's __Host- cookie prefix
      ; only fires when session.cookie_secure is on. TLS is terminated upstream
      ; (ingress / gateway / cloudflared), so the origin sees HTTP but the browser
      ; sees HTTPS; the Secure flag has to be explicitly forced or the cookie will
      ; be issued without it.
      session.cookie_secure = on
      session.cookie_samesite = Lax

  # CronJob: occ cron */5 minutes.
  cronJob:
    enabled: true
    schedule: "*/5 * * * *"
    # IANA timezone (K8s 1.27+). Empty -> cluster default (UTC). Pacific:
    # timeZone: America/Los_Angeles
    timeZone: ""
    # Forbid prevents the oc_filecache_extended PK race seen in v1.9.
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 3
    # cron.php can run long on expensive maintenance (file scan + AV).
    # Raise if `kubectl get cronjob ... -o yaml | yq '.status'` shows
    # last-run failures with DeadlineExceeded.
    activeDeadlineSeconds: 480
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 1
        memory: 1Gi

  # DB migration Job, run as a post-install / post-upgrade hook.
  # Idempotent: the occ db:add-missing-* commands are safe to re-run.
  # Uses `kubectl exec` into the live Pod — does NOT mount the RWO PVC, so the
  # Multi-Attach failure mode is structurally impossible.
  # Shared kubectl image used by:
  #   - templates/nextcloud/cronjob-occ-cron.yaml  (every 5 min)
  #   - templates/nextcloud/job-db-migrate.yaml    (post-install/upgrade hook)
  # The image's entrypoint is `kubectl` (dhi.io/kubectl is distroless). Templates
  # pass kubectl args directly and run multi-step migrations inside the
  # nextcloud-fpm Pod (which has a shell) via `kubectl exec ... -- sh -c <script>`.
  # HOME=/tmp keeps kubectl's cache on a writable emptyDir under readOnlyRootFilesystem.
  kubectl:
    image:
      registry: dhi.io
      repository: kubectl
      tag: "1"
      # Pin via scripts/pin-digests.sh (overrides tag when set).
      digest: ""
      pullPolicy: IfNotPresent

  dbMigrateJob:
    enabled: true
    # Newly-installed apps (files_antivirus / whiteboard / user_oidc) are invisible
    # to the RUNNING fpm workers until php-fpm restarts (APCu app cache is per-SAPI;
    # occ can't flush fpm's copy) — routes 404 until then. When true, the Job
    # detects a FRESH app install (not the already-installed path) and performs a
    # `kubectl rollout restart` + waits for the rollout. Only fires on first
    # install of an app, never on ordinary re-syncs/upgrades.
    restartOnAppInstall: true
    # The conditional restart needs an outer shell to inspect the exec output, so
    # the migrate container uses this shell+kubectl image (same family the backup
    # CronJob already uses) instead of the shell-less dhi kubectl image.
    shellImage:
      registry: docker.io
      repository: alpine/k8s
      tag: "1.31.7"
      # Pin via scripts/pin-digests.sh (overrides tag when set).
      digest: ""
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { cpu: 500m, memory: 256Mi }
    backoffLimit: 3
    # On a fresh install the rollout-wait alone can take several minutes on slow
    # storage (initdb + first /var/www/html copy + maintenance:install).
    # Raise both values together if you see Job DeadlineExceeded.
    activeDeadlineSeconds: 900
    rolloutStatusTimeoutSeconds: 600

# -----------------------------------------------------------------------------
# Postgres
#
# DHI's postgres starts at major 18 (UID 70). 18 is just outside Nextcloud 33's
# officially-tested matrix (13–17) but works in practice. The public overlay uses
# postgres:17-alpine (also UID 70) for a vendor-tested version.
# -----------------------------------------------------------------------------
postgres:
  enabled: true
  image:
    registry: dhi.io
    repository: postgres
    tag: "18"
    # Pin via scripts/pin-digests.sh (overrides tag when set).
    digest: ""
    pullPolicy: IfNotPresent

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi }

  # Server settings passed as `-c key=value` args. Stock postgres ships
  # HDD-era defaults (shared_buffers 128MB, random_page_cost 4) — these
  # assume the 1Gi container limit above and SSD/network-block storage.
  # Sized for the limit: raise shared_buffers with the limit (~25%).
  serverSettings:
    shared_buffers: 256MB
    effective_cache_size: 768MB
    work_mem: 8MB
    random_page_cost: "1.1"
    wal_compression: "on"

  # Persistence. Empty storageClassName ⇒ cluster default StorageClass.
  persistence:
    size: 10Gi
    storageClassName: ""
    accessModes: ["ReadWriteOnce"]

  # Database / user / external Secret reference.
  # Secret keys expected: `nextcloud-db-password` (the app role) and — with
  # manageAppRole — `postgres-admin-password` (the `postgres` superuser).
  # scripts/bootstrap-secrets.sh creates both (and patches the admin key into
  # a pre-existing Secret on re-run).
  auth:
    database: nextcloud
    username: nextcloud
    existingSecret: ""    # REQUIRED — name of pre-created K8s Secret
    # Privilege separation: bootstrap the cluster with a dedicated `postgres`
    # superuser and run Nextcloud as a NOSUPERUSER role that merely OWNS its
    # database (DB ownership covers the Postgres-15+ public-schema permission
    # so app installs/migrations keep working). Without this, the app role IS
    # the instance superuser — an app-level SQL injection then yields code
    # execution in the postgres container via COPY FROM PROGRAM.
    # The wait-for-postgres init container enforces it idempotently on every
    # pod start and AUTO-MIGRATES legacy installs (chart <= 0.4) by demoting
    # the app role. UPGRADE NOTE: re-run scripts/bootstrap-secrets.sh first so
    # the Secret gains the postgres-admin-password key, or the pods fail with
    # CreateContainerConfigError. Set false to keep the legacy single-superuser
    # behavior (discouraged).
    manageAppRole: true

  # Postgres user/group. dhi.io/postgres is UID 70 (also the public Alpine UID).
  # (The public Debian variant uses 999 — adjust here if you switch to it.)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]

  service:
    port: 5432

# -----------------------------------------------------------------------------
# Valkey (Redis wire-compatible)
# -----------------------------------------------------------------------------
valkey:
  enabled: true
  image:
    registry: dhi.io
    repository: valkey
    tag: "9"
    # Pin via scripts/pin-digests.sh (overrides tag when set).
    digest: ""
    pullPolicy: IfNotPresent

  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 512Mi }

  # Auth. The Secret carries both the password (env-referenced by Nextcloud)
  # AND a ready-to-mount valkey.conf with requirepass baked in.
  # Secret keys expected: `valkey-password`, `valkey.conf`.
  auth:
    enabled: true
    existingSecret: ""    # REQUIRED when enabled — name of pre-created K8s Secret

  # No persistence: cache only. Valkey unconditionally uses emptyDir.

  # dhi.io/valkey runs as 'nonroot' UID 65532. (Public valkey image is UID 999.)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  service:
    port: 6379

# -----------------------------------------------------------------------------
# ClamAV (on-upload antivirus)
#
# Heavy: 1–3 GiB RAM and a ~250 MB signature download on every cold start. Uses
# the DHI clamav image's unprivileged entrypoint (nonroot UID 65532). The public
# overlay disables it by default (public clamav non-root needs per-cluster
# validation). Set enabled: false to turn it off.
# -----------------------------------------------------------------------------
clamav:
  enabled: true
  image:
    registry: dhi.io
    repository: clamav
    tag: 1.5-base
    # Pin via scripts/pin-digests.sh (overrides tag when set).
    digest: ""
    pullPolicy: IfNotPresent

  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits:   { cpu: "2",  memory: 3Gi }

  # dhi.io/clamav runs the daemon as 'nonroot' UID 65532. (Public image is UID 100.)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false  # freshclam writes to /var/lib/clamav
    capabilities:
      drop: ["ALL"]

  # Signatures live on emptyDir; freshclam re-downloads (~250 MB) on cold start.
  signaturesEmptyDirSize: 1Gi

  service:
    port: 3310

# -----------------------------------------------------------------------------
# Whiteboard (optional; disabled by default)
#
# Nextcloud Whiteboard's websocket backend (Node.js Socket.IO). There is NO DHI
# image — this uses the public GHCR release image (the documented exception to
# DHI-by-default, like cloudflared). Restricted-PSS compatible (nobody/65532-ish
# UID 65534, readOnlyRootFilesystem). HA via the chart's Valkey.
#
# Requires Nextcloud-side wiring (the db-migrate Job does this automatically when
# enabled): installs the `whiteboard` app, sets jwt_secret_key + collabBackendUrl.
# The shared JWT lives in the external Secret below.
# -----------------------------------------------------------------------------
whiteboard:
  enabled: false
  image:
    registry: ghcr.io
    repository: nextcloud-releases/whiteboard
    tag: "v1.5.9"
    # Pin via scripts/pin-digests.sh (overrides tag when set).
    digest: ""
    pullPolicy: IfNotPresent

  # HA needs replicas >= 2 AND a shared backend (storageStrategy: redis +
  # valkey.enabled). The chart FAILS RENDER if replicas > 1 without redis state.
  replicas: 2

  # Live board-state backend shared across replicas:
  #   redis -> Socket.IO Redis-Streams adapter on the chart's Valkey (HA).
  #   lww   -> in-memory, single instance only (use replicas: 1).
  storageStrategy: redis

  # URL the backend calls back to for JWT verification / API. Empty ⇒ the
  # in-cluster Service (http://<release>.<ns>.svc.cluster.local:<port>), which the
  # whiteboard NetworkPolicy already allows — the recommended default. Set an
  # explicit PUBLIC URL only if the backend must reach Nextcloud through your
  # proxy; the whiteboard policy then also opens world:443 egress.
  nextcloudUrl: ""

  # Public URL where BROWSERS reach this whiteboard backend, set as the
  # `collabBackendUrl` on the Nextcloud whiteboard app. RECOMMENDED: use the SAME
  # URL as Nextcloud (settings.overwriteProtocol://settings.overwriteHost). With
  # gatewayApi.enabled the chart routes /socket.io/ on that host to the whiteboard
  # Service, so the collaboration WebSocket is same-origin — no separate
  # subdomain/cert and no cross-origin browser failures. Empty ⇒ the db-migrate
  # Job skips setting collabBackendUrl (configure it later in the admin UI).
  publicUrl: ""

  # External Secret (created by scripts/bootstrap-secrets.sh).
  # Keys: jwt-secret-key (shared with Nextcloud), redis-url (full
  # redis://:<pw>@<release>-valkey:6379/1 — kept out of any ConfigMap).
  auth:
    existingSecret: ""    # REQUIRED when enabled

  # Server-side recording exports the board via a bundled Chromium launched with
  # --no-sandbox. With no gVisor/Kata sandbox runtime that is unsafe, so it is
  # OFF and intentionally hard to enable. Leave false unless you've sandboxed it.
  recording:
    enabled: false

  service:
    port: 3002

  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

  # nobody (ghcr.io/nextcloud-releases/whiteboard). Restricted-PSS clean.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true    # works with HOME=/tmp (see deployment)
    runAsNonRoot: true
    runAsUser: 65534
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

  pdb:
    enabled: true
    minAvailable: 1

  # Spread replicas across nodes. ScheduleAnyway so a small cluster won't wedge.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway

  podAnnotations: {}
  podLabels: {}

# -----------------------------------------------------------------------------
# Ingress (disabled by default)
#
# Standard networking.k8s.io/v1 Ingress. Enable and set host + ingressClassName.
# TLS is terminated by the ingress controller; the chart's nginx forces HTTPS=on
# to PHP-FPM (see nextcloud.web.httpsBehindProxy). Remember to set
# nextcloud.web.realIp.trustedCidrs to the ingress controller's pod CIDR and add
# the controller's namespace to networkPolicy.nextcloudIngressFrom.
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  host: nextcloud.example.com
  # Extra path entries are uncommon; the single "/" Prefix rule covers Nextcloud.
  pathType: Prefix
  annotations: {}
  # cert-manager example:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  #   nginx.ingress.kubernetes.io/proxy-body-size: "16g"
  tls:
    enabled: false
    secretName: ""   # TLS Secret holding the cert for `host`

# -----------------------------------------------------------------------------
# Gateway API HTTPRoute (disabled by default)
#
# For clusters using Gateway API (Envoy Gateway, Istio, Cilium Gateway, etc.).
# Point parentRef at an existing Gateway. TLS is configured on the Gateway, not
# here. As with Ingress, set realIp.trustedCidrs + networkPolicy.nextcloudIngressFrom.
# -----------------------------------------------------------------------------
gatewayApi:
  enabled: false
  parentRef:
    name: ""              # REQUIRED when enabled — Gateway name
    namespace: ""         # empty ⇒ same namespace as the release
    sectionName: ""       # optional listener name on the Gateway
  hostnames:
    - nextcloud.example.com
  annotations: {}

# -----------------------------------------------------------------------------
# Cloudflare addon (disabled by default)
#
# When enabled, the chart:
#   * (tunnel.enabled) deploys a hardened cloudflared Deployment in this namespace
#   * opens a NetworkPolicy ingress rule from the cloudflared pods to Nextcloud
#   * switches nginx real-IP handling to CF-Connecting-IP (single-valued,
#     recursive off) using cloudflare.realIp.trustedCidrs
# You still create the tunnel + Public Hostname in the Cloudflare dashboard and
# point it at http://<nextcloud-svc>.<ns>.svc.cluster.local:80.
# -----------------------------------------------------------------------------
cloudflare:
  enabled: false

  tunnel:
    # Deploy cloudflared as part of this chart. Set false to run cloudflared
    # yourself elsewhere (then fill cloudflare.externalTunnel below).
    enabled: true
    # cloudflared has no DHI image; this is the upstream distroless image, which
    # already runs as nonroot (UID 65532).
    image:
      registry: docker.io
      repository: cloudflare/cloudflared
      tag: "2024.12.2"
      digest: ""
      pullPolicy: IfNotPresent
    replicas: 2
    # Token-based tunnel. Pre-create a Secret with key `tunnel-token`:
    #   kubectl -n <ns> create secret generic <release>-cloudflared \
    #     --from-literal=tunnel-token='<TOKEN-FROM-DASHBOARD>'
    # or: scripts/bootstrap-secrets.sh --cloudflare-token '<TOKEN>'
    existingSecret: ""    # REQUIRED when tunnel.enabled
    extraArgs: []
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { cpu: 500m, memory: 256Mi }
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      capabilities:
        drop: ["ALL"]

  # Only used when tunnel.enabled is false (you run cloudflared elsewhere). The
  # NetworkPolicy ingress rule selects pods with this label in this namespace.
  externalTunnel:
    namespace: cf-tunnel
    podLabel:
      key: app
      value: cloudflared

  # Real-IP settings applied when cloudflare.enabled (overrides nextcloud.web.realIp).
  realIp:
    header: CF-Connecting-IP
    # cloudflared pod CIDR. If tunnel.enabled, cloudflared runs in THIS namespace,
    # so this is the cluster pod CIDR.
    trustedCidrs: []
    # - 10.0.0.0/8

# -----------------------------------------------------------------------------
# NetworkPolicy (publicly-exposed install ⇒ on by default)
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: true

  # Policy dialect:
  #   cilium     -> CiliumNetworkPolicy (cilium.io/v2). Full fidelity: the
  #                 Cilium Gateway proxy is allowed via fromEntities:[ingress]
  #                 (inexpressible in v1), public egress uses the identity-based
  #                 `world` entity, kubectl Jobs get a precise kube-apiserver
  #                 entity allow. REQUIRES Cilium.
  #   kubernetes -> standard networking.k8s.io/v1 NetworkPolicy for any
  #                 policy-enforcing CNI (Calico, kube-router, …), with
  #                 documented approximations:
  #                   * no gateway identity — if you front Nextcloud with a
  #                     CILIUM Gateway you must use flavor cilium; other
  #                     gateways/ingress controllers run as pods, so add them
  #                     to nextcloudIngressFrom;
  #                   * "world" egress ≈ ipBlock 0.0.0.0/0 minus RFC1918 +
  #                     link-local (clusters on public pod/node IPs leak
  #                     in-cluster ranges into "world");
  #                   * kube-apiserver egress ≈ TCP 443/6443 to anywhere (the
  #                     apiserver has no stable selectable identity in v1).
  flavor: cilium

  # Extra sources allowed to reach Nextcloud on the HTTP port. Entries are raw
  # ingress-source objects in the SELECTED FLAVOR's schema:
  #   flavor cilium     -> fromEndpoints / fromEntities / fromCIDRSet
  #   flavor kubernetes -> NetworkPolicyPeer (namespaceSelector / podSelector /
  #                        ipBlock)
  # The Cilium gateway proxy is allowed AUTOMATICALLY when gatewayApi.enabled
  # (cilium flavor only), and the Cloudflare addon adds its own source — so this
  # is only for OTHER fronts (e.g. a separate ingress controller). Empty ⇒ no
  # extra sources.
  #
  # Example — an ingress-nginx controller's namespace, flavor cilium:
  #   - fromEndpoints:
  #       - matchLabels:
  #           k8s:io.kubernetes.pod.namespace: ingress-nginx
  # Same, flavor kubernetes:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: ingress-nginx
  nextcloudIngressFrom: []

  # Same, for the Whiteboard backend (port 3002). Defaults to nextcloudIngressFrom
  # when empty (browsers reach it through the same front). The Cilium gateway is
  # allowed automatically when gatewayApi.enabled (cilium flavor).
  whiteboardIngressFrom: []

  # Sources allowed to scrape the metrics exporter (port 9205), in the selected
  # flavor's schema (see nextcloudIngressFrom) — typically your Prometheus
  # namespace. REQUIRED for Prometheus to reach the exporter when
  # metrics.enabled + this policy are both on; empty ⇒ the default-deny
  # catch-all blocks every scraper.
  #
  # Example — a Prometheus in the `observability` namespace, flavor cilium:
  #   - fromEndpoints:
  #       - matchLabels:
  #           k8s:io.kubernetes.pod.namespace: observability
  metricsIngressFrom: []

  # Allow egress to the public internet (app updates, federation, freshclam) via
  # Cilium's `world` entity — everything OUTSIDE the cluster. In-cluster traffic
  # stays on the explicit per-Service rules above. Set false to lock down further
  # (Nextcloud may surface errors). No CIDR list needed: `world` is identity-based.
  allowAllEgress: true

# -----------------------------------------------------------------------------
# Tests (helm test)
# -----------------------------------------------------------------------------
tests:
  enabled: true
  image:
    registry: dhi.io
    repository: curl
    tag: 8-alpine3.23
    # Pin via scripts/pin-digests.sh (overrides tag when set).
    digest: ""
    pullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# Metrics (optional; disabled by default)
#
# A Prometheus exporter (xperimental/nextcloud-exporter) that scrapes Nextcloud's
# serverinfo API and re-exposes metrics on :9205 (Nextcloud has no endpoint
# Prometheus can scrape directly). Authenticates with the serverinfo token —
# read-only, no user account; the db-migrate Job writes the SAME token into
# Nextcloud via `occ config:app:set serverinfo token` (so enable the
# dbMigrateJob, or set the token yourself). NO DHI image exists — this is the
# documented public-image exception, hardened restricted-PSS clean.
#
# To scrape it: add a Prometheus target for <release>-metrics:9205 and, with
# networkPolicy.enabled, set networkPolicy.metricsIngressFrom to your Prometheus
# namespace. A Prometheus-Operator ServiceMonitor is rendered when
# metrics.serviceMonitor.enabled (requires the monitoring.coreos.com CRDs).
# -----------------------------------------------------------------------------
metrics:
  enabled: false

  image:
    registry: ghcr.io
    repository: xperimental/nextcloud-exporter
    tag: "0.9.1"
    # Pin via scripts/pin-digests.sh (overrides tag when set).
    digest: "sha256:3e90a38976516444d05f5f6758e5d572ca559b69ad3005ec4029786e9daf9129"
    pullPolicy: IfNotPresent

  # URL the exporter uses to reach Nextcloud. Empty ⇒ the in-cluster Service FQDN
  # (http://<release>.<ns>.svc.cluster.local:<port>). The serverinfo token
  # endpoint does NOT require this host to be a trusted_domain.
  nextcloudUrl: ""

  scrapeTimeout: "5s"
  tlsSkipVerify: false      # only if nextcloudUrl is https with a private CA

  # Serverinfo token (sent as NC-Token). Pre-create the Secret with
  # scripts/bootstrap-secrets.sh --metrics; the db-migrate Job sets the same
  # token in Nextcloud. Key defaults to `token`.
  auth:
    existingSecret: ""      # REQUIRED when enabled
    tokenKey: token

  service:
    port: 9205
    annotations: {}

  # Optional Prometheus-Operator ServiceMonitor (off by default — this chart's
  # reference cluster uses a static scrape config instead). Needs the
  # monitoring.coreos.com/v1 CRDs.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}              # e.g. { release: kube-prometheus-stack } for selector match

  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits:   { cpu: 100m, memory: 64Mi }

  # nobody. Static Go binary — readOnlyRootFilesystem with no writable volume.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

  podAnnotations: {}
  podLabels: {}

# -----------------------------------------------------------------------------
# Backup (optional; disabled by default)
#
# A scheduled CronJob that backs up Postgres (pg_dumpall) and the Nextcloud
# data + config to a PersistentVolumeClaim. Point persistence.storageClassName
# at OFF-CLUSTER storage (e.g. an NFS CSI StorageClass with reclaim Retain) for
# real disaster recovery. It `kubectl exec`s into the live Pods, so it never
# multi-attaches the RWO PVCs.
#
# Needs RBAC-create permission (renders a Role/RoleBinding granting pods/exec)
# and, with networkPolicy.enabled, a CiliumNetworkPolicy letting the backup Pod
# reach the kube-apiserver. NO DHI image bundles kubectl + a shell, so this uses
# the public alpine/k8s image (the documented public-image exception).
# -----------------------------------------------------------------------------
backup:
  enabled: false
  schedule: "30 2 * * *"          # daily 02:30
  timeZone: ""                    # IANA tz (K8s 1.27+); empty => cluster default (UTC)
  retentionDays: 14
  # Wrap the run in `occ maintenance:mode --on/--off` so the DB dump and the
  # files tar are ONE consistent point in time (the Nextcloud manual's
  # recommendation). Trade-off: users get a 503 maintenance page for the length
  # of the backup, so it's off by default — the live tar tolerates changed
  # files and the matching-timestamp pair is consistent enough for most
  # installs. Maintenance mode is re-disabled on every exit path (trap).
  maintenanceMode: false
  concurrencyPolicy: Forbid
  activeDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  # The files tar `kubectl exec`s the live php Pod; bound it with a timeout and a
  # small retry so a transient kubelet-proxy hiccup doesn't fail the whole run.
  filesTimeout: "1800s"
  filesRetries: 3

  image:
    registry: docker.io
    repository: alpine/k8s
    tag: "1.31.7"
    # Pin via scripts/pin-digests.sh (overrides tag when set).
    digest: ""
    pullPolicy: IfNotPresent

  # Backup target. Set storageClassName to off-cluster storage for DR. The PVC
  # gets resource-policy: keep, so `helm uninstall` never deletes your backups.
  persistence:
    size: 100Gi
    storageClassName: ""
    # ReadWriteOnce works on every StorageClass — the CronJob is the only writer.
    # Use ReadWriteMany only if you point storageClassName at an RWX class (e.g.
    # NFS) for real off-cluster DR (recommended for production). A RWX accessMode
    # on an RWO-only class leaves the PVC Pending and backups silently never run.
    accessModes: ["ReadWriteOnce"]
    existingClaim: ""             # use an existing PVC instead of creating one

  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: "1",  memory: 512Mi }

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

# ---------------------------------------------------------------------------
# SSO / OIDC login (user_oidc) — optional add-on.
# The db-migrate Job installs the user_oidc app and UPSERTS the provider below
# on every deploy (idempotent — `occ user_oidc:provider` is keyed on the
# identifier), so connecting Nextcloud to an IdP is fully declarative: no
# admin-UI steps. Client credentials are EXTERNAL-ONLY (existingSecret), same
# security model as whiteboard/metrics: the Deployment exposes them to the php
# container env and the Job reads them from there — never from values/argv.
sso:
  enabled: false

  # External Secret (created by scripts/bootstrap-secrets.sh --sso).
  # Keys: client-id, client-secret — must match the provider registered at the
  # IdP (e.g. an authentik OAuth2 provider blueprint using the same secret).
  auth:
    existingSecret: ""    # REQUIRED when enabled

  provider:
    # occ provider identifier (also shown on the login button).
    identifier: authentik
    # OIDC discovery document of the IdP application, e.g.
    # https://authentik.example.com/application/o/nextcloud/.well-known/openid-configuration
    discoveryUri: ""      # REQUIRED when enabled (render fails otherwise)
    scope: "openid email profile"
    # Hash the IdP subject into a unique NC user id. Leave false when the IdP
    # already sends stable unique subs (e.g. authentik sub_mode=user_uuid).
    uniqueUid: false
    # Create/sync NC groups from the groups claim.
    groupProvisioning: false
    mappings:
      uid: preferred_username
      displayName: name
      email: email
      groups: groups
