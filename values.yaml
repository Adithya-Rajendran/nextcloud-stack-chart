# nextcloud-stack — default values.
#
# Security-first: images default to Docker Hardened Images (DHI, dhi.io) — minimal,
# non-root, CVE-scanned. DHI is a paid Docker subscription, so the default install
# needs an imagePullSecret (see imagePullSecrets below).
#
# No DHI subscription? Use public images instead with the bundled overlay:
#   -f values-public.yaml   public images on Docker Hub, no pull secret needed.
#
# Most users override a small subset in a `-f my-values.yaml` file. See
# `example-values.yaml` for a realistic config.
#
# SECURITY MODEL
# --------------
# Secrets are EXTERNAL ONLY. Pre-create them with `scripts/bootstrap-secrets.sh`
# and reference them via `*.auth.existingSecret`. The chart does not auto-generate
# passwords and does not accept inline password values — both patterns leak
# plaintext into Helm release metadata. See README.md "Secret management".

# -----------------------------------------------------------------------------
# Global / cross-cutting
# -----------------------------------------------------------------------------
nameOverride: ""
fullnameOverride: ""

# Common labels added to every resource.
commonLabels: {}

# Image-pull secrets. The default DHI images live on dhi.io (subscription
# registry) and need one. Create it and reference it here:
#   kubectl -n <ns> create secret docker-registry dhi-pull \
#     --docker-server=dhi.io --docker-username=<user> \
#     --docker-password='<docker-pat>' --docker-email=<email>
# Not needed when using -f values-public.yaml.
imagePullSecrets: []
# - name: dhi-pull

# -----------------------------------------------------------------------------
# Nextcloud (php-fpm + nginx)
# -----------------------------------------------------------------------------
nextcloud:
  # -- PHP-FPM container (the only custom image in the chart; public on GHCR).
  image:
    registry: ghcr.io
    repository: adithya-rajendran/nextcloud-fpm
    tag: 33.0.3-fpm
    # Pin via scripts/pin-digests.sh (overrides tag when set).
    digest: ""
    pullPolicy: IfNotPresent

  # -- nginx sidecar (DHI nginx, runs as nonroot UID 65532). Listens on 8080 and
  # talks to 127.0.0.1:9000 over loopback. `1-compat` (not `:1`) keeps a shell in
  # the image. The public overlay swaps this for nginxinc/nginx-unprivileged.
  web:
    image:
      registry: dhi.io
      repository: nginx
      tag: 1-compat
      # Pin via scripts/pin-digests.sh (overrides tag when set).
      digest: ""
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 1
        memory: 256Mi
    # Real client IP handling. nginx rewrites the connection's source address
    # from a forwarded header, but ONLY when the request arrives from a trusted
    # CIDR (set_real_ip_from). Leave trustedCidrs empty to disable the rewrite
    # entirely (Nextcloud then sees the proxy IP — never spoofable).
    realIp:
      # Behind a standard ingress controller / gateway / reverse proxy use the
      # multi-valued X-Forwarded-For (recursive MUST be true). The Cloudflare
      # addon (cloudflare.enabled) overrides this to the single-valued
      # CF-Connecting-IP with recursive off.
      header: X-Forwarded-For
      # Walk X-Forwarded-For right-to-left, skipping trusted proxies, to find the
      # real client. Required for multi-valued headers — the chart fails render
      # if a multi-valued header is paired with recursive: false (spoofable).
      recursive: true
      # CIDR(s) trusted to set the real-IP header — your proxy's source range
      # (ingress controller / gateway / cloudflared pods). A list. Empty disables
      # real-IP rewriting. Find your pod CIDR with:
      #   kubectl get nodes -o jsonpath='{.items[*].spec.podCIDR}'
      trustedCidrs: []
      # - 10.0.0.0/8
    # TLS is terminated upstream (ingress, gateway, or cloudflared) and the
    # origin Pod sees plain HTTP. Force HTTPS=on to PHP-FPM so Nextcloud sets the
    # Secure cookie flag and emits https:// URLs. Set false only for a plain-HTTP
    # end-to-end install (not recommended).
    httpsBehindProxy: true

    # Loopback self-connection. Nextcloud's "connect to itself" setup checks
    # (WebDAV, .well-known, .mjs/.otf, OCS provider, security headers) require the
    # Pod to HTTP-reach its OWN public URL. Some proxies/CNIs can't hairpin the
    # backend Pod back to itself through the external entrypoint (e.g. the Cilium
    # Gateway returns 403 on that self-loop), which makes those checks fail even
    # though the features work for real clients. When enabled, nginx adds an
    # internal HTTPS listener on :443 (needs NET_BIND_SERVICE — auto-added to the
    # web container) using tlsSecret, and a hostAlias points settings.overwriteHost
    # at 127.0.0.1 so ONLY self-requests resolve to the local nginx. Nothing
    # external changes (the Service/gateway still use the plain listener).
    selfConnect:
      enabled: false
      # kubernetes.io/tls Secret in THIS namespace, valid for settings.overwriteHost
      # and trusted by the php image's CA bundle (e.g. a cert-manager Let's Encrypt
      # cert). REQUIRED when enabled. Assumes settings.overwriteProtocol: https.
      tlsSecret: ""

  replicas: 1
  # Shared RWO PVCs between the fpm + nginx containers (same Pod) ⇒ Recreate;
  # a rolling update would Multi-Attach the volume. Keep Recreate on any RWO SC.
  strategy:
    type: Recreate

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

  podAnnotations: {}
  podLabels: {}

  # Pod-level security context. fsGroup 33 = www-data so fpm can write
  # the shared webroot and nginx can mount it readOnly.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 33
    runAsGroup: 33
    fsGroup: 33
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  # Per-container security contexts.
  containerSecurityContext:
    php:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false   # fpm writes to a few places in the rootfs
      runAsNonRoot: true
      runAsUser: 33
      runAsGroup: 33
      capabilities:
        drop: ["ALL"]
    web:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65532    # dhi.io/nginx 'nonroot' user (UID 65532)
      runAsGroup: 65532
      capabilities:
        drop: ["ALL"]

  # PodDisruptionBudget — documents intent during voluntary disruptions
  # (node drain, cluster upgrade). With 1 replica + maxUnavailable: 0, drain
  # operations require explicit --force or PDB deletion. Set enabled: false
  # for dev/test clusters where uninterrupted nightly drains are fine.
  pdb:
    enabled: true
    maxUnavailable: 0

  # Service in front of the Pod's nginx container. Stays ClusterIP — an Ingress,
  # Gateway API HTTPRoute, or the Cloudflare addon fronts it. Switch to
  # LoadBalancer/NodePort only if you expose the Service directly.
  service:
    type: ClusterIP
    port: 80
    # Must match the nginx listener inside the pod (8080).
    targetPort: 8080
    annotations: {}

  # Persistence. accessModes is a list for K8s API shape, but the fpm + nginx
  # containers share the PVC inside ONE Pod, so ReadWriteOnce is correct and
  # works on any provisioner. RWX is not required.
  persistence:
    webroot:
      size: 10Gi
      # Empty ⇒ the cluster's default StorageClass. Set explicitly to pin one
      # (e.g. a retain-policy class so data survives uninstall).
      storageClassName: ""
      accessModes: ["ReadWriteOnce"]
      # Existing PVC name to mount instead of creating new (migration handle).
      existingClaim: ""
    data:
      size: 100Gi
      storageClassName: ""
      accessModes: ["ReadWriteOnce"]
      existingClaim: ""

  # Admin user. The existingSecret is required (created by scripts/bootstrap-secrets.sh).
  # Secret keys expected: `admin-user`, `admin-password`.
  admin:
    name: admin
    existingSecret: ""    # REQUIRED — name of pre-created K8s Secret

  # Server-side settings (templated into a config.php overlay).
  settings:
    # Public-facing hostname. Change to your domain. Used everywhere Nextcloud
    # emits its own URLs.
    overwriteHost: nextcloud.example.com
    overwriteProtocol: https
    overwriteCliUrl: ""   # auto-derived from overwriteHost+Protocol if empty
    trustedDomains:
      - localhost
      - nextcloud.example.com
    defaultPhoneRegion: US
    maintenanceWindowStart: 11
    # Upload / memory tuning.
    maxFileUploadSize: 16G
    memoryLimit: 512M
    # PHP custom.ini settings — keep the security defaults.
    customPhp: |
      ; Force Secure flag on session cookies — Nextcloud's __Host- cookie prefix
      ; only fires when session.cookie_secure is on. TLS is terminated upstream
      ; (ingress / gateway / cloudflared), so the origin sees HTTP but the browser
      ; sees HTTPS; the Secure flag has to be explicitly forced or the cookie will
      ; be issued without it.
      session.cookie_secure = on
      session.cookie_samesite = Lax

  # CronJob: occ cron */5 minutes.
  cronJob:
    enabled: true
    schedule: "*/5 * * * *"
    # IANA timezone (K8s 1.27+). Empty -> cluster default (UTC). Pacific:
    # timeZone: America/Los_Angeles
    timeZone: ""
    # Forbid prevents the oc_filecache_extended PK race seen in v1.9.
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 3
    # cron.php can run long on expensive maintenance (file scan + AV).
    # Raise if `kubectl get cronjob ... -o yaml | yq '.status'` shows
    # last-run failures with DeadlineExceeded.
    activeDeadlineSeconds: 480
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 1
        memory: 1Gi

  # DB migration Job, run as a post-install / post-upgrade hook.
  # Idempotent: the occ db:add-missing-* commands are safe to re-run.
  # Uses `kubectl exec` into the live Pod — does NOT mount the RWO PVC, so the
  # Multi-Attach failure mode is structurally impossible.
  # Shared kubectl image used by:
  #   - templates/nextcloud/cronjob-occ-cron.yaml  (every 5 min)
  #   - templates/nextcloud/job-db-migrate.yaml    (post-install/upgrade hook)
  # The image's entrypoint is `kubectl` (dhi.io/kubectl is distroless). Templates
  # pass kubectl args directly and run multi-step migrations inside the
  # nextcloud-fpm Pod (which has a shell) via `kubectl exec ... -- sh -c <script>`.
  # HOME=/tmp keeps kubectl's cache on a writable emptyDir under readOnlyRootFilesystem.
  kubectl:
    image:
      registry: dhi.io
      repository: kubectl
      tag: "1"
      # Pin via scripts/pin-digests.sh (overrides tag when set).
      digest: ""
      pullPolicy: IfNotPresent

  dbMigrateJob:
    enabled: true
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { cpu: 500m, memory: 256Mi }
    backoffLimit: 3
    # On a fresh install the rollout-wait alone can take several minutes on slow
    # storage (initdb + first /var/www/html copy + maintenance:install).
    # Raise both values together if you see Job DeadlineExceeded.
    activeDeadlineSeconds: 900
    rolloutStatusTimeoutSeconds: 600

# -----------------------------------------------------------------------------
# Postgres
#
# DHI's postgres starts at major 18 (UID 70). 18 is just outside Nextcloud 33's
# officially-tested matrix (13–17) but works in practice. The public overlay uses
# postgres:17-alpine (also UID 70) for a vendor-tested version.
# -----------------------------------------------------------------------------
postgres:
  enabled: true
  image:
    registry: dhi.io
    repository: postgres
    tag: "18"
    # Pin via scripts/pin-digests.sh (overrides tag when set).
    digest: ""
    pullPolicy: IfNotPresent

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi }

  # Persistence. Empty storageClassName ⇒ cluster default StorageClass.
  persistence:
    size: 10Gi
    storageClassName: ""
    accessModes: ["ReadWriteOnce"]

  # Database / user / external Secret reference.
  # Secret key expected: `nextcloud-db-password`.
  auth:
    database: nextcloud
    username: nextcloud
    existingSecret: ""    # REQUIRED — name of pre-created K8s Secret

  # Postgres user/group. dhi.io/postgres is UID 70 (also the public Alpine UID).
  # (The public Debian variant uses 999 — adjust here if you switch to it.)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]

  service:
    port: 5432

# -----------------------------------------------------------------------------
# Valkey (Redis wire-compatible)
# -----------------------------------------------------------------------------
valkey:
  enabled: true
  image:
    registry: dhi.io
    repository: valkey
    tag: "9"
    # Pin via scripts/pin-digests.sh (overrides tag when set).
    digest: ""
    pullPolicy: IfNotPresent

  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 512Mi }

  # Auth. The Secret carries both the password (env-referenced by Nextcloud)
  # AND a ready-to-mount valkey.conf with requirepass baked in.
  # Secret keys expected: `valkey-password`, `valkey.conf`.
  auth:
    enabled: true
    existingSecret: ""    # REQUIRED when enabled — name of pre-created K8s Secret

  # No persistence: cache only. Valkey unconditionally uses emptyDir.

  # dhi.io/valkey runs as 'nonroot' UID 65532. (Public valkey image is UID 999.)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  service:
    port: 6379

# -----------------------------------------------------------------------------
# ClamAV (on-upload antivirus)
#
# Heavy: 1–3 GiB RAM and a ~250 MB signature download on every cold start. Uses
# the DHI clamav image's unprivileged entrypoint (nonroot UID 65532). The public
# overlay disables it by default (public clamav non-root needs per-cluster
# validation). Set enabled: false to turn it off.
# -----------------------------------------------------------------------------
clamav:
  enabled: true
  image:
    registry: dhi.io
    repository: clamav
    tag: 1.5-base
    # Pin via scripts/pin-digests.sh (overrides tag when set).
    digest: ""
    pullPolicy: IfNotPresent

  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits:   { cpu: "2",  memory: 3Gi }

  # dhi.io/clamav runs the daemon as 'nonroot' UID 65532. (Public image is UID 100.)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false  # freshclam writes to /var/lib/clamav
    capabilities:
      drop: ["ALL"]

  # Signatures live on emptyDir; freshclam re-downloads (~250 MB) on cold start.
  signaturesEmptyDirSize: 1Gi

  service:
    port: 3310

# -----------------------------------------------------------------------------
# Whiteboard (optional; disabled by default)
#
# Nextcloud Whiteboard's websocket backend (Node.js Socket.IO). There is NO DHI
# image — this uses the public GHCR release image (the documented exception to
# DHI-by-default, like cloudflared). Restricted-PSS compatible (nobody/65532-ish
# UID 65534, readOnlyRootFilesystem). HA via the chart's Valkey.
#
# Requires Nextcloud-side wiring (the db-migrate Job does this automatically when
# enabled): installs the `whiteboard` app, sets jwt_secret_key + collabBackendUrl.
# The shared JWT lives in the external Secret below.
# -----------------------------------------------------------------------------
whiteboard:
  enabled: false
  image:
    registry: ghcr.io
    repository: nextcloud-releases/whiteboard
    tag: "v1.5.3"
    # Pin via scripts/pin-digests.sh (overrides tag when set).
    digest: ""
    pullPolicy: IfNotPresent

  # HA needs replicas >= 2 AND a shared backend (storageStrategy: redis +
  # valkey.enabled). The chart FAILS RENDER if replicas > 1 without redis state.
  replicas: 2

  # Live board-state backend shared across replicas:
  #   redis -> Socket.IO Redis-Streams adapter on the chart's Valkey (HA).
  #   lww   -> in-memory, single instance only (use replicas: 1).
  storageStrategy: redis

  # Public Nextcloud URL the backend calls back to (JWT verification / API).
  nextcloudUrl: https://nextcloud.example.com

  # Public URL where BROWSERS reach this whiteboard backend, set as the
  # `collabBackendUrl` on the Nextcloud whiteboard app. RECOMMENDED: use the SAME
  # URL as Nextcloud (settings.overwriteProtocol://settings.overwriteHost). With
  # gatewayApi.enabled the chart routes /socket.io/ on that host to the whiteboard
  # Service, so the collaboration WebSocket is same-origin — no separate
  # subdomain/cert and no cross-origin browser failures. Empty ⇒ the db-migrate
  # Job skips setting collabBackendUrl (configure it later in the admin UI).
  publicUrl: ""

  # External Secret (created by scripts/bootstrap-secrets.sh).
  # Keys: jwt-secret-key (shared with Nextcloud), redis-url (full
  # redis://:<pw>@<release>-valkey:6379/1 — kept out of any ConfigMap).
  auth:
    existingSecret: ""    # REQUIRED when enabled

  # Server-side recording exports the board via a bundled Chromium launched with
  # --no-sandbox. With no gVisor/Kata sandbox runtime that is unsafe, so it is
  # OFF and intentionally hard to enable. Leave false unless you've sandboxed it.
  recording:
    enabled: false

  service:
    port: 3002

  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

  # nobody (ghcr.io/nextcloud-releases/whiteboard). Restricted-PSS clean.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true    # works with HOME=/tmp (see deployment)
    runAsNonRoot: true
    runAsUser: 65534
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

  pdb:
    enabled: true
    minAvailable: 1

  # Spread replicas across nodes. ScheduleAnyway so a small cluster won't wedge.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway

  podAnnotations: {}
  podLabels: {}

# -----------------------------------------------------------------------------
# Ingress (disabled by default)
#
# Standard networking.k8s.io/v1 Ingress. Enable and set host + ingressClassName.
# TLS is terminated by the ingress controller; the chart's nginx forces HTTPS=on
# to PHP-FPM (see nextcloud.web.httpsBehindProxy). Remember to set
# nextcloud.web.realIp.trustedCidrs to the ingress controller's pod CIDR and add
# the controller's namespace to networkPolicy.nextcloudIngressFrom.
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  host: nextcloud.example.com
  # Extra path entries are uncommon; the single "/" Prefix rule covers Nextcloud.
  pathType: Prefix
  annotations: {}
  # cert-manager example:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  #   nginx.ingress.kubernetes.io/proxy-body-size: "16g"
  tls:
    enabled: false
    secretName: ""   # TLS Secret holding the cert for `host`

# -----------------------------------------------------------------------------
# Gateway API HTTPRoute (disabled by default)
#
# For clusters using Gateway API (Envoy Gateway, Istio, Cilium Gateway, etc.).
# Point parentRef at an existing Gateway. TLS is configured on the Gateway, not
# here. As with Ingress, set realIp.trustedCidrs + networkPolicy.nextcloudIngressFrom.
# -----------------------------------------------------------------------------
gatewayApi:
  enabled: false
  parentRef:
    name: ""              # REQUIRED when enabled — Gateway name
    namespace: ""         # empty ⇒ same namespace as the release
    sectionName: ""       # optional listener name on the Gateway
  hostnames:
    - nextcloud.example.com
  annotations: {}

# -----------------------------------------------------------------------------
# Cloudflare addon (disabled by default)
#
# When enabled, the chart:
#   * (tunnel.enabled) deploys a hardened cloudflared Deployment in this namespace
#   * opens a NetworkPolicy ingress rule from the cloudflared pods to Nextcloud
#   * switches nginx real-IP handling to CF-Connecting-IP (single-valued,
#     recursive off) using cloudflare.realIp.trustedCidrs
# You still create the tunnel + Public Hostname in the Cloudflare dashboard and
# point it at http://<nextcloud-svc>.<ns>.svc.cluster.local:80.
# -----------------------------------------------------------------------------
cloudflare:
  enabled: false

  tunnel:
    # Deploy cloudflared as part of this chart. Set false to run cloudflared
    # yourself elsewhere (then fill cloudflare.externalTunnel below).
    enabled: true
    # cloudflared has no DHI image; this is the upstream distroless image, which
    # already runs as nonroot (UID 65532).
    image:
      registry: docker.io
      repository: cloudflare/cloudflared
      tag: "2024.12.2"
      digest: ""
      pullPolicy: IfNotPresent
    replicas: 2
    # Token-based tunnel. Pre-create a Secret with key `tunnel-token`:
    #   kubectl -n <ns> create secret generic <release>-cloudflared \
    #     --from-literal=tunnel-token='<TOKEN-FROM-DASHBOARD>'
    # or: scripts/bootstrap-secrets.sh --cloudflare-token '<TOKEN>'
    existingSecret: ""    # REQUIRED when tunnel.enabled
    extraArgs: []
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { cpu: 500m, memory: 256Mi }
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      capabilities:
        drop: ["ALL"]

  # Only used when tunnel.enabled is false (you run cloudflared elsewhere). The
  # NetworkPolicy ingress rule selects pods with this label in this namespace.
  externalTunnel:
    namespace: cf-tunnel
    podLabel:
      key: app
      value: cloudflared

  # Real-IP settings applied when cloudflare.enabled (overrides nextcloud.web.realIp).
  realIp:
    header: CF-Connecting-IP
    # cloudflared pod CIDR. If tunnel.enabled, cloudflared runs in THIS namespace,
    # so this is the cluster pod CIDR.
    trustedCidrs: []
    # - 10.0.0.0/8

# -----------------------------------------------------------------------------
# NetworkPolicy (publicly-exposed install ⇒ on by default)
# -----------------------------------------------------------------------------
networkPolicy:
  # Renders CiliumNetworkPolicy (cilium.io/v2). REQUIRES Cilium — the Gateway API
  # path allows the gateway via fromEntities:[ingress], which standard
  # NetworkPolicy v1 cannot express. On another CNI set this to false and bring
  # your own policy. See README "Network policy (Cilium)".
  enabled: true

  # Extra sources allowed to reach Nextcloud on the HTTP port, as raw Cilium
  # ingress selectors (fromEndpoints / fromEntities / fromCIDRSet). The Cilium
  # gateway proxy is allowed AUTOMATICALLY when gatewayApi.enabled, and the
  # Cloudflare addon adds its own source — so this is only for OTHER fronts (e.g.
  # a separate ingress controller). Empty ⇒ no extra sources.
  #
  # Example — an ingress-nginx controller's namespace:
  #   - fromEndpoints:
  #       - matchLabels:
  #           k8s:io.kubernetes.pod.namespace: ingress-nginx
  nextcloudIngressFrom: []

  # Same, for the Whiteboard backend (port 3002). Defaults to nextcloudIngressFrom
  # when empty (browsers reach it through the same front). The Cilium gateway is
  # allowed automatically when gatewayApi.enabled.
  whiteboardIngressFrom: []

  # Allow egress to the public internet (app updates, federation, freshclam) via
  # Cilium's `world` entity — everything OUTSIDE the cluster. In-cluster traffic
  # stays on the explicit per-Service rules above. Set false to lock down further
  # (Nextcloud may surface errors). No CIDR list needed: `world` is identity-based.
  allowAllEgress: true

# -----------------------------------------------------------------------------
# Tests (helm test)
# -----------------------------------------------------------------------------
tests:
  enabled: true
  image:
    registry: dhi.io
    repository: curl
    tag: 8-alpine3.23
    # Pin via scripts/pin-digests.sh (overrides tag when set).
    digest: ""
    pullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# Backup (optional; disabled by default)
#
# A scheduled CronJob that backs up Postgres (pg_dumpall) and the Nextcloud
# data + config to a PersistentVolumeClaim. Point persistence.storageClassName
# at OFF-CLUSTER storage (e.g. an NFS CSI StorageClass with reclaim Retain) for
# real disaster recovery. It `kubectl exec`s into the live Pods, so it never
# multi-attaches the RWO PVCs.
#
# Needs RBAC-create permission (renders a Role/RoleBinding granting pods/exec)
# and, with networkPolicy.enabled, a CiliumNetworkPolicy letting the backup Pod
# reach the kube-apiserver. NO DHI image bundles kubectl + a shell, so this uses
# the public alpine/k8s image (the documented public-image exception).
# -----------------------------------------------------------------------------
backup:
  enabled: false
  schedule: "30 2 * * *"          # daily 02:30
  timeZone: ""                    # IANA tz (K8s 1.27+); empty => cluster default (UTC)
  retentionDays: 14
  concurrencyPolicy: Forbid
  activeDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  image:
    registry: docker.io
    repository: alpine/k8s
    tag: "1.31.7"
    # Pin via scripts/pin-digests.sh (overrides tag when set).
    digest: ""
    pullPolicy: IfNotPresent

  # Backup target. Set storageClassName to off-cluster storage for DR. The PVC
  # gets resource-policy: keep, so `helm uninstall` never deletes your backups.
  persistence:
    size: 100Gi
    storageClassName: ""
    accessModes: ["ReadWriteMany"]
    existingClaim: ""             # use an existing PVC instead of creating one

  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: "1",  memory: 512Mi }

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
