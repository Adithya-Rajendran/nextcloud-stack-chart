apiVersion: v2
name: nextcloud-stack
description: |
  Self-hosted Nextcloud stack — fpm + nginx in one Pod, Postgres, Valkey, and
  optional ClamAV. Docker Hardened Images by default (public-image overlay
  bundled); expose via Ingress, Gateway API, or the optional Cloudflare tunnel
  addon. A `helm upgrade` needs no out-of-chart re-apply work.
type: application

# Chart version — bump on chart changes.
version: 0.9.3

# Pinned to the custom fpm image's Nextcloud version.
# When bumping Nextcloud, bump this AND values.yaml `nextcloud.image.tag`.
appVersion: "33.0.5"

home: https://github.com/adithya-rajendran/nextcloud-stack-chart
sources:
  - https://github.com/adithya-rajendran/nextcloud-stack-chart
  - https://github.com/adithya-rajendran/nextcloud-images
keywords:
  - nextcloud
  - postgres
  - valkey
  - clamav
  - ingress
  - gateway-api
  - cloudflare
maintainers:
  - name: Adithya Rajendran

# No subcharts. Owning every manifest is the point of this chart.
dependencies: []

annotations:
  # Bumped each time the *manifest* shape changes meaningfully.
  artifacthub.io/changes: |
    - kind: added
      description: "Availability: the stack's core single-replica workloads (nextcloud, postgres, valkey, clamav) now carry a pod anti-affinity that spreads them onto DIFFERENT nodes, so a single node failure no longer downs the whole stack. Soft (preferredDuringScheduling) by default — a cluster with fewer nodes than workloads still schedules everything — and selects the shared name+instance labels so each component repels every other. Toggle via the new top-level `spread` values (spread.enabled default true, spread.required for a hard guarantee, spread.topologyKey, spread.weight). Default replica counts are unchanged."
    - kind: changed
      description: "Backup: the retention prune is now observable — files/backup.sh logs each archive it prunes (`-print -delete`) and lists the archives it keeps after the sweep, so the CronJob logs show whether retention is working instead of running silently."
    - kind: added
      description: "SSO/egress: new `networkPolicy.nextcloudEgressTo` — a list of complete egress rules (in the active cilium/kubernetes flavor) appended to the Nextcloud policy. Lets the user_oidc backchannel reach an in-cluster IdP (e.g. Authentik via the gateway VIP), which `allowAllEgress: [world]` cannot cover since the backend is an in-cluster identity. Previously required a hand-applied CiliumNetworkPolicy alongside the release."
    - kind: changed
      description: "PDB: `nextcloud.pdb.enabled` now defaults to false. A PDB on the single-replica Nextcloud Pod provides no availability and, with maxUnavailable: 0, silently blocks `kubectl drain` and every rolling node/OS upgrade until forced. It is now an explicit opt-in for operators who want drains to pause for acknowledgement."
