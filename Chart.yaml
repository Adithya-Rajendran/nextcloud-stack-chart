apiVersion: v2
name: nextcloud-stack
description: |
  Self-hosted Nextcloud stack — fpm + nginx in one Pod, Postgres, Valkey, and
  optional ClamAV. Docker Hardened Images by default (public-image overlay
  bundled); expose via Ingress, Gateway API, or the optional Cloudflare tunnel
  addon. A `helm upgrade` needs no out-of-chart re-apply work.
type: application

# Chart version — bump on chart changes.
version: 0.4.0

# Pinned to the custom fpm image's Nextcloud version.
# When bumping Nextcloud, bump this AND values.yaml `nextcloud.image.tag`.
appVersion: "33.0.3"

home: https://github.com/adithya-rajendran/nextcloud-stack-chart
sources:
  - https://github.com/adithya-rajendran/nextcloud-stack-chart
  - https://github.com/adithya-rajendran/nextcloud-images
keywords:
  - nextcloud
  - postgres
  - valkey
  - clamav
  - ingress
  - gateway-api
  - cloudflare
maintainers:
  - name: Adithya Rajendran

# No subcharts. Owning every manifest is the point of this chart.
dependencies: []

annotations:
  # Bumped each time the *manifest* shape changes meaningfully.
  artifacthub.io/changes: |
    - kind: security
      description: Restore the security headers (nosniff, X-Frame-Options, Referrer-Policy, …) on static-asset responses — the location-level Cache-Control add_header was cancelling the inherited server-level set
    - kind: security
      description: The occ cron + db-migrate Jobs are now network-policy enforced (egress to kube-apiserver + DNS only, mirroring the backup Job) instead of exempted from the default-deny
    - kind: fixed
      description: The default-deny CiliumNetworkPolicy now selects only this release's pods instead of every pod in the namespace
    - kind: fixed
      description: example-values + docs showed NetworkPolicy-v1 namespaceSelector syntax for networkPolicy.*IngressFrom, which CiliumNetworkPolicy rejects — corrected to Cilium fromEndpoints selectors
    - kind: changed
      description: nextcloud.replicas > 1 now fails render unless both Nextcloud PVCs are ReadWriteMany (RWO would Multi-Attach); removed the unused nextcloud.admin.name value
    - kind: added
      description: NOTES warnings for valkey.auth.enabled=false and networkPolicy.enabled=false; CI now schema-validates CiliumNetworkPolicy/HTTPRoute/ServiceMonitor and renders the backup/whiteboard/metrics templates
