apiVersion: v2
name: nextcloud-stack
description: |
  Self-hosted Nextcloud stack — fpm + nginx in one Pod, Postgres, Valkey, and
  optional ClamAV. Docker Hardened Images by default (public-image overlay
  bundled); expose via Ingress, Gateway API, or the optional Cloudflare tunnel
  addon. A `helm upgrade` needs no out-of-chart re-apply work.
type: application

# Chart version — bump on chart changes.
version: 0.7.3

# Pinned to the custom fpm image's Nextcloud version.
# When bumping Nextcloud, bump this AND values.yaml `nextcloud.image.tag`.
appVersion: "33.0.5"

home: https://github.com/adithya-rajendran/nextcloud-stack-chart
sources:
  - https://github.com/adithya-rajendran/nextcloud-stack-chart
  - https://github.com/adithya-rajendran/nextcloud-images
keywords:
  - nextcloud
  - postgres
  - valkey
  - clamav
  - ingress
  - gateway-api
  - cloudflare
maintainers:
  - name: Adithya Rajendran

# No subcharts. Owning every manifest is the point of this chart.
dependencies: []

annotations:
  # Bumped each time the *manifest* shape changes meaningfully.
  artifacthub.io/changes: |
    - kind: fixed
      description: "web (nginx) container livenessProbe changed from httpGet /status.php (a full PHP->Postgres request) to a tcpSocket check on the http port. Probing the DB-coupled endpoint for LIVENESS let a transient DB/DNS blip SIGKILL nginx (371 web-container restarts observed vs 1 for php), dropping in-flight client/DAV connections and cold-starting caches. readinessProbe keeps /status.php, so a pod with a dead DB is still removed from Service endpoints — it just isn't restarted."
    - kind: changed
      description: "OPcache max_accelerated_files raised 16384 -> 32531 and memory_consumption 192 -> 256MB. The live app set ships ~17918 PHP files, exceeding the 16384 slot cap and forcing per-request eviction/recompile of hot scripts; 32531 (prime) covers it with headroom."
