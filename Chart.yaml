apiVersion: v2
name: nextcloud-stack
description: |
  Self-hosted Nextcloud stack — fpm + nginx in one Pod, Postgres, Valkey, and
  optional ClamAV. Docker Hardened Images by default (public-image overlay
  bundled); expose via Ingress, Gateway API, or the optional Cloudflare tunnel
  addon. A `helm upgrade` needs no out-of-chart re-apply work.
type: application

# Chart version — bump on chart changes.
version: 0.7.2

# Pinned to the custom fpm image's Nextcloud version.
# When bumping Nextcloud, bump this AND values.yaml `nextcloud.image.tag`.
appVersion: "33.0.5"

home: https://github.com/adithya-rajendran/nextcloud-stack-chart
sources:
  - https://github.com/adithya-rajendran/nextcloud-stack-chart
  - https://github.com/adithya-rajendran/nextcloud-images
keywords:
  - nextcloud
  - postgres
  - valkey
  - clamav
  - ingress
  - gateway-api
  - cloudflare
maintainers:
  - name: Adithya Rajendran

# No subcharts. Owning every manifest is the point of this chart.
dependencies: []

annotations:
  # Bumped each time the *manifest* shape changes meaningfully.
  artifacthub.io/changes: |
    - kind: fixed
      description: "restore (MODE=restore) no longer hangs to the Job deadline: every nextcloud-pod kubectl call is now request-timeout bounded, and the large file stream is verified by CONTENT (config.php instanceid) instead of trusting an exec exit code that a stuck-open API-proxy websocket can leave non-zero AFTER the bytes land. Tunable via RESTORE_REQUEST_TIMEOUT / RESTORE_STREAM_TIMEOUT."
    - kind: fixed
      description: "restore drops the pointless pre-restore maintenance-mode toggle (its config.php write was immediately overwritten by the file restore) and bounces the Nextcloud Deployment via the scale subresource so the app boots clean against the converged config.php + reloaded DB, instead of leaving the in-place exec-mutated pod that wedged on its next entrypoint run."
