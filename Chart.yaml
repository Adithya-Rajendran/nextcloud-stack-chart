apiVersion: v2
name: nextcloud-stack
description: |
  Self-hosted Nextcloud stack — fpm + nginx in one Pod, Postgres, Valkey, and
  optional ClamAV. Docker Hardened Images by default (public-image overlay
  bundled); expose via Ingress, Gateway API, or the optional Cloudflare tunnel
  addon. A `helm upgrade` needs no out-of-chart re-apply work.
type: application

# Chart version — bump on chart changes.
version: 0.8.0

# Pinned to the custom fpm image's Nextcloud version.
# When bumping Nextcloud, bump this AND values.yaml `nextcloud.image.tag`.
appVersion: "33.0.5"

home: https://github.com/adithya-rajendran/nextcloud-stack-chart
sources:
  - https://github.com/adithya-rajendran/nextcloud-stack-chart
  - https://github.com/adithya-rajendran/nextcloud-images
keywords:
  - nextcloud
  - postgres
  - valkey
  - clamav
  - ingress
  - gateway-api
  - cloudflare
maintainers:
  - name: Adithya Rajendran

# No subcharts. Owning every manifest is the point of this chart.
dependencies: []

annotations:
  # Bumped each time the *manifest* shape changes meaningfully.
  artifacthub.io/changes: |
    - kind: fixed
      description: "Backup no longer fails on the flaky kubelet-proxy 502: the Postgres dump is now produced by a `pg-dump` initContainer that runs pg_dumpall OVER THE SERVICE (reusing the chart's own Postgres image, via libpq PG* env — no shell/gzip needed, works on the DHI image), instead of `kubectl exec` into the postgres pod. The single-archive format (pg.sql.gz + files.tar.gz + meta) is unchanged, so restore is unaffected. pg_dumpall connects as the `postgres` superuser (postgres-admin-password) under manageAppRole."
    - kind: changed
      description: "Backup file tar (kubectl exec into the live php pod — required for the RWO data PVC) is now timeout-bounded with a small retry (BACKUP_FILES_TIMEOUT / BACKUP_FILES_RETRIES) instead of failing the whole run on one transient blip."
    - kind: added
      description: "scripts/dr-restore.sh — one-command bare-cluster disaster recovery: re-attaches the off-cluster backup archive via a static NFS PV, bootstraps Secrets, helm-installs the chart, and runs the existing MODE=restore Job. Idempotent. Restore needs only the values overlay + the archive (Secrets are regenerated)."
    - kind: added
      description: "NetworkPolicy (both Cilium and v1 flavors): backup egress to Postgres:5432 and Postgres ingress from the backup pod, for the new Service-based DB dump."
