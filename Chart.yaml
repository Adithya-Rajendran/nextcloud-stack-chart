apiVersion: v2
name: nextcloud-stack
description: |
  Self-hosted Nextcloud stack — fpm + nginx in one Pod, Postgres, Valkey, and
  optional ClamAV. Docker Hardened Images by default (public-image overlay
  bundled); expose via Ingress, Gateway API, or the optional Cloudflare tunnel
  addon. A `helm upgrade` needs no out-of-chart re-apply work.
type: application

# Chart version — bump on chart changes.
version: 0.5.0

# Pinned to the custom fpm image's Nextcloud version.
# When bumping Nextcloud, bump this AND values.yaml `nextcloud.image.tag`.
appVersion: "33.0.3"

home: https://github.com/adithya-rajendran/nextcloud-stack-chart
sources:
  - https://github.com/adithya-rajendran/nextcloud-stack-chart
  - https://github.com/adithya-rajendran/nextcloud-images
keywords:
  - nextcloud
  - postgres
  - valkey
  - clamav
  - ingress
  - gateway-api
  - cloudflare
maintainers:
  - name: Adithya Rajendran

# No subcharts. Owning every manifest is the point of this chart.
dependencies: []

annotations:
  # Bumped each time the *manifest* shape changes meaningfully.
  artifacthub.io/changes: |
    - kind: security
      description: Postgres privilege separation (postgres.auth.manageAppRole, default on) — Nextcloud now runs as a NOSUPERUSER role that owns only its database; the instance bootstraps with a dedicated `postgres` superuser, legacy installs are auto-migrated. UPGRADE NOTE - re-run scripts/bootstrap-secrets.sh first so the Secret gains the postgres-admin-password key
    - kind: added
      description: networkPolicy.flavor=kubernetes — standard NetworkPolicy v1 rendering for non-Cilium CNIs (documented approximations for gateway identity, world egress, and apiserver egress); cilium remains the default
    - kind: added
      description: Weekly pin-digests workflow that resolves every image tag to a digest and opens a PR updating pins.yaml / pins-public.yaml (needs DHI_USERNAME/DHI_TOKEN secrets); CI validates the pinned render when present
    - kind: fixed
      description: backup.sh now verifies the Postgres dump (gzip integrity + pg_dump completion trailer) instead of trusting pipe status, which masked failed dumps on shells without pipefail
    - kind: changed
      description: The backup files tar now also captures custom_apps/ (store-installed apps) and themes/ when present, and gzip-verifies the archive; new opt-in backup.maintenanceMode freezes writes during the run for a fully consistent dump↔files pair
