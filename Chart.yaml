apiVersion: v2
name: nextcloud-stack
description: |
  Homegrown Nextcloud stack — fpm + nginx in one Pod, Postgres, Valkey, ClamAV.
  Replaces groundhog2k/nextcloud + standalone manifests so a `helm upgrade`
  doesn't require any out-of-chart re-apply work.
type: application

# Chart version — bump on chart changes.
version: 0.1.0

# Pinned to the custom fpm image's Nextcloud version.
# When bumping Nextcloud, bump this AND values.yaml `nextcloud.image.tag`.
appVersion: "33.0.3"

home: https://github.com/Adithya-Rajendran/nextcloud-aio-on-k8s
sources:
  - https://github.com/Adithya-Rajendran/nextcloud-aio-on-k8s
  - https://github.com/Adithya-Rajendran/nextcloud-images
keywords:
  - nextcloud
  - postgres
  - valkey
  - clamav
  - cloudflared
maintainers:
  - name: Adithya Rajendran

# No subcharts. Owning every manifest is the point of this chart.
dependencies: []

annotations:
  # Bumped each time the *manifest* shape changes meaningfully.
  artifacthub.io/changes: |
    - kind: added
      description: Initial chart — replaces groundhog2k/nextcloud + standalone clamav.yaml
