apiVersion: v2
name: nextcloud-stack
description: |
  Self-hosted Nextcloud stack — fpm + nginx in one Pod, Postgres, Valkey, and
  optional ClamAV. Public images by default; expose via Ingress, Gateway API, or
  the optional Cloudflare tunnel addon. A `helm upgrade` needs no out-of-chart
  re-apply work.
type: application

# Chart version — bump on chart changes.
version: 0.3.0

# Pinned to the custom fpm image's Nextcloud version.
# When bumping Nextcloud, bump this AND values.yaml `nextcloud.image.tag`.
appVersion: "33.0.3"

home: https://github.com/adithya-rajendran/nextcloud-stack-chart
sources:
  - https://github.com/adithya-rajendran/nextcloud-stack-chart
  - https://github.com/adithya-rajendran/nextcloud-images
keywords:
  - nextcloud
  - postgres
  - valkey
  - clamav
  - ingress
  - gateway-api
  - cloudflare
maintainers:
  - name: Adithya Rajendran

# No subcharts. Owning every manifest is the point of this chart.
dependencies: []

annotations:
  # Bumped each time the *manifest* shape changes meaningfully.
  artifacthub.io/changes: |
    - kind: added
      description: Public-image overlay (values-public.yaml) for installs without a Docker Hardened Images subscription; DHI remains the default
    - kind: added
      description: Ingress and Gateway API (HTTPRoute) templates, both disabled by default
    - kind: added
      description: Optional Cloudflare addon (cloudflare.enabled) that can deploy cloudflared and switches real-IP handling to CF-Connecting-IP
    - kind: changed
      description: Generic X-Forwarded-For real-IP trust by default; NetworkPolicy ingress is now a configurable source list (networkPolicy.nextcloudIngressFrom)
    - kind: changed
      description: De-personalized defaults — default StorageClass, RFC1918 in-cluster CIDRs, example.com placeholders
