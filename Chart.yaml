apiVersion: v2
name: nextcloud-stack
description: |
  Self-hosted Nextcloud stack — fpm + nginx in one Pod, Postgres, Valkey, and
  optional ClamAV. Docker Hardened Images by default (public-image overlay
  bundled); expose via Ingress, Gateway API, or the optional Cloudflare tunnel
  addon. A `helm upgrade` needs no out-of-chart re-apply work.
type: application

# Chart version — bump on chart changes.
version: 0.9.2

# Pinned to the custom fpm image's Nextcloud version.
# When bumping Nextcloud, bump this AND values.yaml `nextcloud.image.tag`.
appVersion: "33.0.5"

home: https://github.com/adithya-rajendran/nextcloud-stack-chart
sources:
  - https://github.com/adithya-rajendran/nextcloud-stack-chart
  - https://github.com/adithya-rajendran/nextcloud-images
keywords:
  - nextcloud
  - postgres
  - valkey
  - clamav
  - ingress
  - gateway-api
  - cloudflare
maintainers:
  - name: Adithya Rajendran

# No subcharts. Owning every manifest is the point of this chart.
dependencies: []

annotations:
  # Bumped each time the *manifest* shape changes meaningfully.
  artifacthub.io/changes: |
    - kind: fixed
      description: "Newly installed apps (files_antivirus/whiteboard/user_oidc) no longer 404 until someone manually restarts the pod: fpm's APCu app cache is per-SAPI, so a fresh `occ app:install` was invisible to the running workers. The db-migrate Job now prints a sentinel on FRESH installs and its (new) bash wrapper performs `kubectl rollout restart` + waits for the rollout — only on first install, never on ordinary re-syncs. Toggle via nextcloud.dbMigrateJob.restartOnAppInstall (default true). The migrate container switches from the shell-less dhi kubectl image to a shell+kubectl image (nextcloud.dbMigrateJob.shellImage, alpine/k8s — the family the backup CronJob already uses); the occ SA gains `patch` on deployments."
