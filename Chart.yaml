apiVersion: v2
name: nextcloud-stack
description: |
  Self-hosted Nextcloud stack — fpm + nginx in one Pod, Postgres, Valkey, and
  optional ClamAV. Docker Hardened Images by default (public-image overlay
  bundled); expose via Ingress, Gateway API, or the optional Cloudflare tunnel
  addon. A `helm upgrade` needs no out-of-chart re-apply work.
type: application

# Chart version — bump on chart changes.
version: 0.6.1

# Pinned to the custom fpm image's Nextcloud version.
# When bumping Nextcloud, bump this AND values.yaml `nextcloud.image.tag`.
appVersion: "33.0.3"

home: https://github.com/adithya-rajendran/nextcloud-stack-chart
sources:
  - https://github.com/adithya-rajendran/nextcloud-stack-chart
  - https://github.com/adithya-rajendran/nextcloud-images
keywords:
  - nextcloud
  - postgres
  - valkey
  - clamav
  - ingress
  - gateway-api
  - cloudflare
maintainers:
  - name: Adithya Rajendran

# No subcharts. Owning every manifest is the point of this chart.
dependencies: []

annotations:
  # Bumped each time the *manifest* shape changes meaningfully.
  artifacthub.io/changes: |
    - kind: fixed
      description: postgres volumeClaimTemplates no longer stamp version-varying labels (helm.sh/chart, app.kubernetes.io/version) - vCT metadata is immutable, so any chart version bump made the StatefulSet update forbidden and failed the upgrade (broke 0.2.0 -> 0.3.0 in the field)
    - kind: fixed
      description: default-deny CiliumNetworkPolicy now uses one empty rule per direction (ingress/egress [{}]) instead of empty arrays - Cilium >=1.19 rejects empty arrays ("rule must have at least one of Ingress, IngressDeny, Egress, EgressDeny"), leaving the policy Valid=False and the intended default-deny SILENTLY UNENFORCED; empty CNP rules match no traffic (unlike NetworkPolicy v1), verified on Cilium 1.19.3
