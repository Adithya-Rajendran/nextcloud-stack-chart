apiVersion: v2
name: nextcloud-stack
description: |
  Self-hosted Nextcloud stack — fpm + nginx in one Pod, Postgres, Valkey, and
  optional ClamAV. Docker Hardened Images by default (public-image overlay
  bundled); expose via Ingress, Gateway API, or the optional Cloudflare tunnel
  addon. A `helm upgrade` needs no out-of-chart re-apply work.
type: application

# Chart version — bump on chart changes.
version: 0.9.0

# Pinned to the custom fpm image's Nextcloud version.
# When bumping Nextcloud, bump this AND values.yaml `nextcloud.image.tag`.
appVersion: "33.0.5"

home: https://github.com/adithya-rajendran/nextcloud-stack-chart
sources:
  - https://github.com/adithya-rajendran/nextcloud-stack-chart
  - https://github.com/adithya-rajendran/nextcloud-images
keywords:
  - nextcloud
  - postgres
  - valkey
  - clamav
  - ingress
  - gateway-api
  - cloudflare
maintainers:
  - name: Adithya Rajendran

# No subcharts. Owning every manifest is the point of this chart.
dependencies: []

annotations:
  # Bumped each time the *manifest* shape changes meaningfully.
  artifacthub.io/changes: |
    - kind: added
      description: "SSO / OIDC login add-on (`sso.*`): the db-migrate Job now installs the user_oidc app and idempotently UPSERTS an OIDC provider (`occ user_oidc:provider`) on every deploy, making IdP wiring fully declarative — no admin-UI steps. Client credentials follow the chart's external-Secret model (sso.auth.existingSecret, keys client-id/client-secret) and reach occ via the php pod's env; the secret is passed with --clientsecret-env where the installed user_oidc supports it (never in argv), with a safe fallback for older releases. Render fails fast when sso.enabled without existingSecret/discoveryUri."
    - kind: added
      description: "scripts/bootstrap-secrets.sh --sso: creates <release>-sso with client-id (nextcloud) + a generated client-secret; register the same pair at the IdP (e.g. via an authentik blueprint reading the secret through !Env)."
