# nextcloud-stack example values — a realistic minimal install behind an
# ingress-nginx controller, using the default Docker Hardened Images.
#
# Prerequisites:
#   1. Pre-create the chart's external Secrets:
#        ./scripts/bootstrap-secrets.sh --namespace nextcloud --release nextcloud-stack
#   2. Create the dhi.io pull secret (DHI images need a FREE Docker account):
#        kubectl -n nextcloud create secret docker-registry dhi-pull \
#          --docker-server=dhi.io --docker-username=<user> \
#          --docker-password='<docker-pat>' --docker-email=<email>
#
# Install (from the chart root):
#   helm install nextcloud-stack . -n nextcloud --create-namespace \
#       -f example-values.yaml
#
# Prefer plain Docker Hub images? Drop the imagePullSecrets below and also pass
#   -f values-public.yaml   (public images on Docker Hub, no pull secret)
#
# The chart fails template render if any required `existingSecret` is empty.

imagePullSecrets:
  - name: dhi-pull

nextcloud:
  admin:
    name: admin
    # Created by bootstrap-secrets.sh.
    existingSecret: nextcloud-stack-admin
  settings:
    overwriteHost: nextcloud.example.com
    overwriteProtocol: https
    trustedDomains:
      - localhost
      - nextcloud.example.com
    maxFileUploadSize: 16G
    memoryLimit: 512M
  web:
    # Trust the ingress controller's pod CIDR so access logs and Nextcloud see
    # the real client IP (X-Forwarded-For, walked recursively). Narrow to your
    # controller's exact range for tighter trust.
    realIp:
      header: X-Forwarded-For
      recursive: true
      trustedCidrs:
        - 10.0.0.0/8

  persistence:
    webroot:
      size: 10Gi
      # Empty ⇒ default StorageClass. Pin one to control reclaim policy.
      storageClassName: ""
    data:
      size: 100Gi
      storageClassName: ""

postgres:
  enabled: true
  auth:
    database: nextcloud
    username: nextcloud
    existingSecret: nextcloud-stack-postgres

valkey:
  enabled: true
  auth:
    enabled: true
    existingSecret: nextcloud-stack-valkey

# On-upload virus scanning (heavy). On by default with the DHI clamav image.
clamav:
  enabled: true

# Expose via a standard Ingress. Swap for gatewayApi or cloudflare instead — see
# values.yaml for those blocks.
ingress:
  enabled: true
  className: nginx
  host: nextcloud.example.com
  tls:
    enabled: true
    secretName: nextcloud-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16g"

networkPolicy:
  enabled: true
  # Allow the ingress-nginx controller's namespace to reach Nextcloud.
  nextcloudIngressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
