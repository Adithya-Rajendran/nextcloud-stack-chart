# nextcloud-stack example values.
#
# Prerequisite: pre-create the chart's external Secrets:
#   ./scripts/bootstrap-secrets.sh --namespace aio-test --release nextcloud-stack
#
# Then install (from the chart root):
#   helm install nextcloud-stack . -n aio-test --create-namespace \
#       -f example-values.yaml
#
# The chart fails template render if any `existingSecret` is empty.

# Required for the dhi.io/* images (they're behind a subscription registry).
# Pre-create with:
#   kubectl -n aio-test create secret docker-registry dhi-pull \
#       --docker-server=dhi.io --docker-username=<user> \
#       --docker-password='<docker-pat>' --docker-email=<email>
imagePullSecrets:
  - name: dhi-pull

nextcloud:
  admin:
    name: admin
    # Created by bootstrap-secrets.sh.
    existingSecret: nextcloud-stack-admin
  settings:
    overwriteHost: drive.example.net
    overwriteProtocol: https
    trustedDomains:
      - localhost
      - drive.example.net
    trustedProxies:
      - 10.1.0.0/16
    forwardedForHeaders:
      - HTTP_CF_CONNECTING_IP
    maxFileUploadSize: 16G
    memoryLimit: 512M

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

  persistence:
    webroot:
      size: 10Gi
      storageClassName: csi-cinder-sc-retain
    data:
      size: 100Gi
      storageClassName: csi-cinder-sc-retain

postgres:
  enabled: true
  auth:
    database: nextcloud
    username: nextcloud
    existingSecret: nextcloud-stack-postgres
  persistence:
    size: 10Gi
    storageClassName: csi-cinder-sc-retain

valkey:
  enabled: true
  auth:
    enabled: true
    existingSecret: nextcloud-stack-valkey

clamav:
  enabled: true

networkPolicy:
  enabled: true
  cfTunnel:
    namespace: cf-tunnel
