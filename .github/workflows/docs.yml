name: docs

# Builds the Material for MkDocs documentation site. Since the repo is private on
# a free plan (no GitHub Pages), this validates the docs in PRs (--strict catches
# any broken link or anchor) and, on main, uploads the rendered site as a
# downloadable artifact — open the run and grab "docs-site", or run
# `mkdocs serve` locally (see requirements-docs.txt).

on:
  pull_request:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'requirements-docs.txt', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'requirements-docs.txt', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: mkdocs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs Material
        run: python -m pip install -r requirements-docs.txt

      - name: Build (fails on any broken link or anchor)
        run: mkdocs build --strict --site-dir site

      - name: Upload rendered site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
          retention-days: 30
