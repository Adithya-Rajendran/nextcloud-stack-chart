# GitHub Pages (Jekyll) config for the nextcloud-stack documentation site.
# Served from this /docs folder on the default branch. The default GitHub Pages
# build enables jekyll-relative-links, so the [page](other.md) links between these
# docs resolve to the generated URLs automatically.
title: nextcloud-stack
description: A security-first Helm chart for Nextcloud on Kubernetes — full documentation.
theme: jekyll-theme-cayman

# Apply the theme layout to every page, and serve the wiki home (README.md) at the
# site root. Files carry only empty front matter, so these defaults drive layout.
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "README.md"
    values:
      permalink: /

# Keep chart sources out of the built site.
exclude:
  - "*.tgz"
