{{/*
Nextcloud Deployment — single Pod with two containers sharing the webroot PVC:
  - php (fpm) — listens 127.0.0.1:9000, owns /var/www/html
  - web (nginx) — listens :8080, mounts webroot readOnly

Strategy is Recreate because RWO Cinder can't be Multi-Attached during a rolling
upgrade. replicas > 1 fails render unless both PVCs are ReadWriteMany (guard
below) — with RWO a second replica deadlocks on a Multi-Attach error.
*/}}
{{- if gt (int .Values.nextcloud.replicas) 1 }}
{{- if not (and (has "ReadWriteMany" .Values.nextcloud.persistence.webroot.accessModes) (has "ReadWriteMany" .Values.nextcloud.persistence.data.accessModes)) }}
{{- fail "nextcloud.replicas > 1 requires ReadWriteMany in BOTH nextcloud.persistence.webroot.accessModes and nextcloud.persistence.data.accessModes — with ReadWriteOnce the second replica fails with a Multi-Attach volume error. This chart targets a single replica; scale out only on RWX storage (if using existingClaim, set accessModes to match the claim)." }}
{{- end }}
{{- end }}
{{- include "nextcloud-stack.requirePostgres" . -}}
{{- include "nextcloud-stack.requireImagePullSecret" . -}}
{{- include "nextcloud-stack.requireSecret" (dict "existing" .Values.nextcloud.admin.existingSecret "section" "nextcloud.admin") -}}
{{- include "nextcloud-stack.requireSecret" (dict "existing" .Values.postgres.auth.existingSecret "section" "postgres.auth") -}}
{{- if and .Values.valkey.enabled .Values.valkey.auth.enabled -}}
{{- include "nextcloud-stack.requireSecret" (dict "existing" .Values.valkey.auth.existingSecret "section" "valkey.auth") -}}
{{- end -}}
{{- if .Values.sso.enabled -}}
{{- include "nextcloud-stack.requireSecret" (dict "existing" .Values.sso.auth.existingSecret "section" "sso.auth") -}}
{{- end -}}
{{- if and .Values.nextcloud.web.selfConnect.enabled (not .Values.nextcloud.web.selfConnect.tlsSecret) -}}
{{- fail "nextcloud.web.selfConnect.enabled requires nextcloud.web.selfConnect.tlsSecret — a kubernetes.io/tls Secret valid for nextcloud.settings.overwriteHost (e.g. a cert-manager Let's Encrypt cert in this namespace)." -}}
{{- end -}}
{{- $fullname := include "nextcloud-stack.nextcloud.fullname" . -}}
{{- $adminSecret := include "nextcloud-stack.secretName" (dict "existing" .Values.nextcloud.admin.existingSecret "default" (printf "%s-admin" (include "nextcloud-stack.fullname" .))) -}}
{{- $dbSecret := include "nextcloud-stack.secretName" (dict "existing" .Values.postgres.auth.existingSecret "default" (printf "%s-postgres" (include "nextcloud-stack.fullname" .))) -}}
{{- $valkeySecret := include "nextcloud-stack.secretName" (dict "existing" .Values.valkey.auth.existingSecret "default" (printf "%s-valkey" (include "nextcloud-stack.fullname" .))) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "nextcloud-stack.nextcloud.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.nextcloud.replicas }}
  strategy:
    type: {{ .Values.nextcloud.strategy.type }}
  selector:
    matchLabels:
      {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 8 }}
        {{- with .Values.nextcloud.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pod when any of the chart-managed configs/secret data change.
        checksum/config:    {{ include (print $.Template.BasePath "/nextcloud/configmap-config.yaml") . | sha256sum }}
        checksum/nginx:     {{ include (print $.Template.BasePath "/nextcloud/configmap-nginx.yaml") . | sha256sum }}
        checksum/php-ini:   {{ include (print $.Template.BasePath "/nextcloud/configmap-php-ini.yaml") . | sha256sum }}
        checksum/fpm-pool:  {{ include (print $.Template.BasePath "/nextcloud/configmap-fpm-pool.yaml") . | sha256sum }}
        checksum/hooks:     {{ include (print $.Template.BasePath "/nextcloud/configmap-hooks.yaml") . | sha256sum }}
        {{- with .Values.nextcloud.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "nextcloud-stack.imagePullSecrets" . | nindent 6 }}
{{- if .Values.nextcloud.web.selfConnect.enabled }}
      # Pin the public host to loopback so the Pod's "connect to itself" setup
      # checks reach the in-Pod nginx :443 listener instead of hairpinning the
      # external gateway (which 403s the backend-to-self loop). Only self-requests
      # are affected; the gateway still reaches nginx via the Pod IP.
      hostAliases:
        - ip: 127.0.0.1
          hostnames:
            - {{ .Values.nextcloud.settings.overwriteHost | quote }}
{{- end }}
      # 120s lets in-flight file uploads finish before SIGKILL. Defaults to
      # 30s, which silently truncates uploads on rolling restarts.
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.nextcloud.podSecurityContext | nindent 8 }}
      # Prefer a node not already running postgres/valkey/clamav (see values spread).
      {{- include "nextcloud-stack.podAntiAffinity" . | nindent 6 }}
      # Init: wait for Postgres (and, with manageAppRole, ensure the app role)
      # before fpm starts.
      initContainers:
        - name: wait-for-postgres
          # Use the postgres image — it has pg_isready + psql AND a shell.
          image: {{ include "nextcloud-stack.image" .Values.postgres.image }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
{{- if and .Values.postgres.enabled .Values.postgres.auth.manageAppRole }}
          env:
            - name: HOME
              value: /tmp
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: PGAPP_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: PGAPP_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: PGAPP_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $dbSecret }}, key: nextcloud-db-password } }
            - name: PGADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $dbSecret }}, key: postgres-admin-password } }
{{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              host="{{ include "nextcloud-stack.postgres.host" . }}"
              port="{{ .Values.postgres.service.port }}"
              echo "Waiting for $host:$port ..."
              ready=0
              for i in $(seq 1 60); do
                if pg_isready -h "$host" -p "$port" -q; then
                  ready=1; break
                fi
                sleep 2
              done
              if [ "$ready" -ne 1 ]; then
                echo "Timed out waiting for $host:$port" >&2
                exit 1
              fi
              echo "$host:$port reachable"
{{- if and .Values.postgres.enabled .Values.postgres.auth.manageAppRole }}

              # ---- app-role separation (idempotent, runs every pod start) ----
              # Guarantees BEFORE fpm starts: the app role exists, owns the app
              # database, its password matches the Secret (rotation = rotate
              # Secret + restart), and — wherever PostgreSQL permits — carries
              # no superuser-ish attributes. Legacy data dirs (chart <= 0.4
              # bootstrapped the app user AS the instance superuser): while the
              # app role is still super, it creates the `postgres` admin role;
              # PostgreSQL <= 15 then demotes the app role, but PostgreSQL 16+
              # REFUSES to demote the cluster's bootstrap role, so there the
              # script warns and continues (full separation needs a rebuild
              # from backup — docs/security.md). psql -v/:'var' quoting keeps
              # the passwords out of the SQL text and injection-safe.
              psql_admin() { PGPASSWORD="$PGADMIN_PASSWORD" psql -X -q -h "$host" -p "$port" -U postgres -d postgres "$@"; }
              psql_app()   { PGPASSWORD="$PGAPP_PASSWORD"   psql -X -q -h "$host" -p "$port" -U "$PGAPP_USER" -d "$PGAPP_DB" "$@"; }

              if ! psql_admin -Atc 'SELECT 1' >/dev/null 2>&1; then
                is_super="$(psql_app -Atc 'SELECT rolsuper FROM pg_roles WHERE rolname = current_user' 2>/dev/null || true)"
                if [ "$is_super" = "t" ]; then
                  echo "legacy bootstrap detected: creating dedicated 'postgres' admin role"
                  psql_app -v ON_ERROR_STOP=1 -v admin_pw="$PGADMIN_PASSWORD" <<'SQL'
              SELECT 'CREATE ROLE postgres' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres')\gexec
              ALTER ROLE postgres WITH LOGIN SUPERUSER PASSWORD :'admin_pw';
              SQL
                else
                  echo "ERROR: cannot connect as 'postgres' using the Secret's postgres-admin-password key," >&2
                  echo "and '$PGAPP_USER' is not a legacy superuser that could create it." >&2
                  echo "Re-run scripts/bootstrap-secrets.sh (adds the key to the Secret), fix the key's value," >&2
                  echo "or set postgres.auth.manageAppRole=false to keep the legacy layout." >&2
                  exit 1
                fi
              fi

              # Hygiene first (safe even on an undemotable bootstrap role):
              # role exists + LOGIN + Secret-synced password; database exists,
              # app-owned, PUBLIC's default grants dropped.
              psql_admin -v ON_ERROR_STOP=1 -v app="$PGAPP_USER" -v db="$PGAPP_DB" -v app_pw="$PGAPP_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN', :'app') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'app')\gexec
              ALTER ROLE :"app" WITH LOGIN PASSWORD :'app_pw';
              SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'app') WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db')\gexec
              ALTER DATABASE :"db" OWNER TO :"app";
              REVOKE ALL ON DATABASE :"db" FROM PUBLIC;
              SQL

              demote='ALTER ROLE :"app" WITH NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;'
              bootstrap_role="$(psql_admin -Atc 'SELECT rolname FROM pg_roles WHERE oid = 10')"
              if [ "$bootstrap_role" != "$PGAPP_USER" ]; then
                printf '%s\n' "$demote" | psql_admin -v ON_ERROR_STOP=1 -v app="$PGAPP_USER"
                echo "app-role separation OK: '$PGAPP_USER' is NOSUPERUSER and owns '$PGAPP_DB'"
              elif printf '%s\n' "$demote" | psql_admin -v ON_ERROR_STOP=1 -v app="$PGAPP_USER" >/dev/null 2>&1; then
                echo "app-role separation OK: demoted legacy bootstrap role '$PGAPP_USER' (PostgreSQL <= 15)"
              else
                echo "WARNING: '$PGAPP_USER' is this cluster's BOOTSTRAP superuser and PostgreSQL 16+" >&2
                echo "refuses to demote the bootstrap role — the app keeps superuser on this data" >&2
                echo "directory. Password sync + database hygiene were still applied. For full" >&2
                echo "privilege separation, rebuild from a backup onto a fresh PVC (which" >&2
                echo "bootstraps as 'postgres') — see docs/security.md#database-privilege-separation." >&2
              fi
{{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70       # postgres image UID
            runAsGroup: 70
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
      containers:
        # ---- PHP-FPM ----------------------------------------------------------
        - name: php
          image: {{ include "nextcloud-stack.image" .Values.nextcloud.image }}
          imagePullPolicy: {{ .Values.nextcloud.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.nextcloud.containerSecurityContext.php | nindent 12 }}
          env:
            # The upstream image's entrypoint reads these and writes config.php
            # on first install. Subsequent boots use the existing config.php.
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: {{ join " " .Values.nextcloud.settings.trustedDomains | quote }}
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom: { secretKeyRef: { name: {{ $adminSecret }}, key: admin-user } }
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $adminSecret }}, key: admin-password } }
            - name: NEXTCLOUD_DATA_DIR
              value: /var/www/html/data
            - name: OVERWRITEHOST
              value: {{ .Values.nextcloud.settings.overwriteHost | quote }}
            - name: OVERWRITEPROTOCOL
              value: {{ .Values.nextcloud.settings.overwriteProtocol | quote }}
            - name: OVERWRITECLIURL
              value: {{ include "nextcloud-stack.overwriteCliUrl" . | quote }}
            # Postgres connection
            - name: POSTGRES_HOST
              value: {{ include "nextcloud-stack.postgres.host" . }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $dbSecret }}, key: nextcloud-db-password } }
{{- if and .Values.valkey.enabled .Values.valkey.auth.enabled }}
            # Valkey: password is referenced by config.php overlay via getenv().
            # We deliberately do NOT set REDIS_HOST here — the upstream fpm
            # entrypoint sees it and tries to write redis-session.ini into
            # /usr/local/etc/php/conf.d/ which is root-owned (we run non-root).
            # Host + port are templated into zz-chart.config.php literally.
            - name: REDIS_HOST_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $valkeySecret }}, key: valkey-password } }
{{- end }}
{{- if .Values.whiteboard.enabled }}
            # Shared JWT for the Whiteboard backend. Not consumed by fpm itself —
            # the db-migrate Job reads it from this pod's env to run
            # `occ config:app:set whiteboard jwt_secret_key`.
            - name: WHITEBOARD_JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.whiteboard.auth.existingSecret }}, key: jwt-secret-key } }
{{- end }}
{{- if .Values.metrics.enabled }}
            # Serverinfo monitoring token. Not consumed by fpm itself — the
            # db-migrate Job reads it from this pod's env to run
            # `occ config:app:set serverinfo token` (the exporter sends the same
            # value as NC-Token).
            - name: SERVERINFO_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.metrics.auth.existingSecret }}, key: {{ .Values.metrics.auth.tokenKey }} } }
{{- end }}
{{- if .Values.sso.enabled }}
            # OIDC client credentials for user_oidc. Not consumed by fpm itself —
            # the db-migrate Job reads them from this pod's env and registers the
            # provider via `occ user_oidc:provider` (secret passed via env where
            # the CLI supports --clientsecret-env, never rendered into manifests).
            - name: OIDC_CLIENT_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.sso.auth.existingSecret }}, key: client-id } }
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.sso.auth.existingSecret }}, key: client-secret } }
{{- end }}
          ports:
            - name: fpm
              containerPort: 9000
              protocol: TCP
          volumeMounts:
            - name: webroot
              mountPath: /var/www/html
            - name: data
              mountPath: /var/www/html/data
            - name: php-ini
              mountPath: /usr/local/etc/php/conf.d/custom.ini
              subPath: custom.ini
              readOnly: true
            - name: php-ini
              mountPath: /usr/local/etc/php/conf.d/zz-chart-opcache.ini
              subPath: zz-chart-opcache.ini
              readOnly: true
            - name: fpm-pool
              mountPath: /usr/local/etc/php-fpm.d/zz-nextcloud.conf
              subPath: zz-nextcloud.conf
              readOnly: true
            - name: chart-config
              mountPath: /etc/nextcloud-stack
              readOnly: true
            - name: chart-hooks
              mountPath: /docker-entrypoint-hooks.d/before-starting
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            tcpSocket: { port: fpm }
            # First install copies ~250 MB of Nextcloud source onto the PVC and
            # runs `occ maintenance:install`. Generous startup budget.
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 120    # 10 min budget
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: { port: fpm }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket: { port: fpm }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.nextcloud.resources | nindent 12 }}
        # ---- NGINX ------------------------------------------------------------
        - name: web
          image: {{ include "nextcloud-stack.image" .Values.nextcloud.web.image }}
          imagePullPolicy: {{ .Values.nextcloud.web.image.pullPolicy }}
          securityContext:
            {{- $webSc := deepCopy .Values.nextcloud.containerSecurityContext.web }}
            {{- if .Values.nextcloud.web.selfConnect.enabled }}
            {{- /* loopback nginx binds :443 — restricted PSS permits adding back NET_BIND_SERVICE */}}
            {{- $caps := $webSc.capabilities | default dict }}
            {{- $_ := set $caps "add" (list "NET_BIND_SERVICE") }}
            {{- $_ := set $webSc "capabilities" $caps }}
            {{- end }}
            {{- toYaml $webSc | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.nextcloud.service.targetPort }}
              protocol: TCP
          volumeMounts:
            - name: webroot
              mountPath: /var/www/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
{{- if .Values.nextcloud.web.selfConnect.enabled }}
            - name: selfconnect-tls
              mountPath: /etc/nginx/selfconnect-tls
              readOnly: true
{{- end }}
          startupProbe:
            # /status.php is the most reliable readiness signal (returns
            # installed:true once setup finished).
            httpGet:
              path: /status.php
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 120
            timeoutSeconds: 3
          livenessProbe:
            # nginx-only liveness: confirm the web server is accepting TCP, NOT
            # that PHP/Postgres are reachable. /status.php is a full PHP->DB
            # request, so using it for LIVENESS let a transient DB/DNS blip
            # SIGKILL nginx — dropping in-flight client/DAV connections and
            # cold-starting its caches (observed: 371 web restarts vs 1 php).
            # readinessProbe below keeps /status.php, so a pod with a dead DB is
            # still pulled from Service endpoints; it just isn't restarted.
            # (startupProbe above already gates first-boot, so liveness can't
            # race startup.)
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /status.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.nextcloud.web.resources | nindent 12 }}
      volumes:
        - name: webroot
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-webroot" (include "nextcloud-stack.fullname" .)) .Values.nextcloud.persistence.webroot.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "nextcloud-stack.fullname" .)) .Values.nextcloud.persistence.data.existingClaim }}
        - name: php-ini
          configMap:
            name: {{ include "nextcloud-stack.fullname" . }}-php-ini
        - name: fpm-pool
          configMap:
            name: {{ include "nextcloud-stack.fullname" . }}-fpm-pool
        - name: chart-config
          configMap:
            name: {{ include "nextcloud-stack.fullname" . }}-config
        - name: chart-hooks
          configMap:
            name: {{ include "nextcloud-stack.fullname" . }}-hooks
            defaultMode: 0755
        - name: nginx-conf
          configMap:
            name: {{ include "nextcloud-stack.fullname" . }}-nginx
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
        - name: nginx-tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: nginx-cache
          emptyDir: { sizeLimit: 256Mi }
{{- if .Values.nextcloud.web.selfConnect.enabled }}
        - name: selfconnect-tls
          secret:
            secretName: {{ .Values.nextcloud.web.selfConnect.tlsSecret }}
            defaultMode: 0440
{{- end }}
