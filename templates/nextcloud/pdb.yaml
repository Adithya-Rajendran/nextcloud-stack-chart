{{- if .Values.nextcloud.pdb.enabled }}
{{/*
PodDisruptionBudget for the Nextcloud Pod. OFF by default (see values.yaml).

With a single replica this PDB cannot provide availability; `maxUnavailable: 0`
only forces voluntary disruptions (kubectl drain, node/OS upgrade, autoscaler
scale-down) to be acknowledged via --force or by deleting the PDB. That is a
deliberate opt-in — on rolling-upgrade clusters it otherwise wedges every drain.
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nextcloud-stack.nextcloud.fullname" . }}
  labels:
    {{- include "nextcloud-stack.nextcloud.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.nextcloud.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 6 }}
{{- end }}
