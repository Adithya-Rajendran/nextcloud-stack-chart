{{/*
PHP custom.ini — mounted at /usr/local/etc/php/conf.d/custom.ini inside the
fpm container. Picked up by php-fpm at startup; no restart hack needed.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-php-ini
  labels:
    {{- include "nextcloud-stack.nextcloud.labels" . | nindent 4 }}
data:
  custom.ini: |
    ; Managed by the nextcloud-stack chart. Edit `nextcloud.settings.customPhp`
    ; in values.yaml to change.
    upload_max_filesize = {{ .Values.nextcloud.settings.maxFileUploadSize }}
    post_max_size       = {{ .Values.nextcloud.settings.maxFileUploadSize }}
    memory_limit        = {{ .Values.nextcloud.settings.memoryLimit }}
{{ .Values.nextcloud.settings.customPhp | indent 4 }}
  # Separate zz- prefixed file: conf.d loads alphabetically and the image's own
  # opcache-recommended.ini sorts AFTER custom.ini — opcache overrides placed in
  # custom.ini would silently lose. zz-chart-opcache.ini loads last and wins.
  zz-chart-opcache.ini: |
    ; Managed by the nextcloud-stack chart — see nextcloud.settings.opcache.
    opcache.memory_consumption = {{ .Values.nextcloud.settings.opcache.memoryConsumption }}
    opcache.interned_strings_buffer = {{ .Values.nextcloud.settings.opcache.internedStringsBuffer }}
    opcache.max_accelerated_files = {{ .Values.nextcloud.settings.opcache.maxAcceleratedFiles }}
    opcache.jit_buffer_size = {{ .Values.nextcloud.settings.opcache.jitBufferSize }}
