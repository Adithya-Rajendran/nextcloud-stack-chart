{{/*
nginx config for the Nextcloud Pod's web sidecar. The actual config lives in
`files/nginx.conf.tpl` (vendored from the upstream Nextcloud nginx recipe).
We `tpl` it through the Go template engine so values.yaml substitutions
(set_real_ip_from, listen port, max body size) work.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-nginx
  labels:
    {{- include "nextcloud-stack.nextcloud.labels" . | nindent 4 }}
data:
  nginx.conf: |
{{ tpl (.Files.Get "files/nginx.conf.tpl") . | indent 4 }}
