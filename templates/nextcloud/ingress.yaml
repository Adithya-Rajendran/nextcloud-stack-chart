{{- if .Values.ingress.enabled }}
{{/*
Standard Ingress fronting the Nextcloud Service. The ingress controller
terminates TLS; the chart's nginx forces HTTPS=on to PHP-FPM
(nextcloud.web.httpsBehindProxy). For correct client IPs in logs/rate-limits,
set nextcloud.web.realIp.trustedCidrs to the controller's pod CIDR and add the
controller's namespace to networkPolicy.nextcloudIngressFrom.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nextcloud-stack.nextcloud.fullname" . }}
  labels:
    {{- include "nextcloud-stack.nextcloud.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
{{- if .Values.whiteboard.enabled }}
          # Whiteboard real-time-collaboration WebSocket, served on the SAME host
          # as Nextcloud at /socket.io/ (no separate subdomain/cert, no
          # cross-origin). More specific than "/", so it wins for /socket.io/.
          # Point whiteboard.publicUrl at this same host. Some controllers also
          # need a WebSocket/timeout annotation on this Ingress (see docs).
          - path: /socket.io/
            pathType: Prefix
            backend:
              service:
                name: {{ include "nextcloud-stack.whiteboard.fullname" . }}
                port:
                  number: {{ .Values.whiteboard.service.port }}
{{- end }}
          - path: /
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "nextcloud-stack.nextcloud.fullname" . }}
                port:
                  number: {{ .Values.nextcloud.service.port }}
{{- end }}
