{{- if .Values.gatewayApi.enabled }}
{{/*
Gateway API HTTPRoute fronting the Nextcloud Service. TLS is configured on the
referenced Gateway's listener, not here. Point parentRef at an existing Gateway.
As with Ingress, set nextcloud.web.realIp.trustedCidrs to the gateway's pod CIDR
and add its namespace to networkPolicy.nextcloudIngressFrom.

Requires the Gateway API CRDs (gateway.networking.k8s.io/v1) to be installed.
*/}}
{{- if not .Values.gatewayApi.parentRef.name }}
{{- fail "gatewayApi.enabled is true but gatewayApi.parentRef.name is empty. Set gatewayApi.parentRef.name to the name of an existing Gateway." }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "nextcloud-stack.nextcloud.fullname" . }}
  labels:
    {{- include "nextcloud-stack.nextcloud.labels" . | nindent 4 }}
  {{- with .Values.gatewayApi.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayApi.parentRef.name }}
      {{- with .Values.gatewayApi.parentRef.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.gatewayApi.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.gatewayApi.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "nextcloud-stack.nextcloud.fullname" . }}
          port: {{ .Values.nextcloud.service.port }}
{{- end }}
