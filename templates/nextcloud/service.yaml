{{/*
Service in front of the Pod's nginx container. Routes :{{ .Values.nextcloud.service.port }}
on the Service to :{{ .Values.nextcloud.service.targetPort }} on the nginx container.

Fronted by an Ingress, a Gateway API HTTPRoute, or the Cloudflare addon — all
target `http://<svc>.<ns>.svc.cluster.local:{{ .Values.nextcloud.service.port }}`.
Defaults to ClusterIP; switch nextcloud.service.type to expose it directly.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nextcloud-stack.nextcloud.fullname" . }}
  labels:
    {{- include "nextcloud-stack.nextcloud.labels" . | nindent 4 }}
  {{- with .Values.nextcloud.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.nextcloud.service.type }}
  selector:
    {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.nextcloud.service.port }}
      targetPort: {{ .Values.nextcloud.service.targetPort }}
      protocol: TCP
