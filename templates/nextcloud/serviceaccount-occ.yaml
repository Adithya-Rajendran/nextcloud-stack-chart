{{/*
ServiceAccount + Role + RoleBinding used by the occ-cron CronJob AND the
post-upgrade DB-migrate Job.

Both run `kubectl exec deploy/<nextcloud> -c php -- php /var/www/html/occ ...`
against the live Pod. That avoids mounting the RWO PVC from a second pod,
which is what blew up the groundhog2k postupgrade Job (DEPLOYMENT_PLAN.md
v1.11 changelog: "Multi-Attach error on the RWO Cinder PVCs").

Scope: namespace-local, minimum-needed verbs.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-occ
  labels:
    {{- include "nextcloud-stack.nextcloud.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-occ
  labels:
    {{- include "nextcloud-stack.nextcloud.labels" . | nindent 4 }}
rules:
  # `kubectl rollout status` needs list+watch on deployments. resourceNames
  # can't be combined with watch, so we drop the name pin — the only risk
  # is being able to LIST other deployments in this namespace, which is
  # informational (not exfiltration-grade).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Exec into the live pod — this is the real blast radius for the SA.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-occ
  labels:
    {{- include "nextcloud-stack.nextcloud.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "nextcloud-stack.fullname" . }}-occ
subjects:
  - kind: ServiceAccount
    name: {{ include "nextcloud-stack.fullname" . }}-occ
    namespace: {{ .Release.Namespace }}
