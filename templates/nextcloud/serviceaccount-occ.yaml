{{/*
ServiceAccount + Role + RoleBinding used by the occ-cron CronJob AND the
post-upgrade DB-migrate Job.

Both run `kubectl exec deploy/<nextcloud> -c php -- php /var/www/html/occ ...`
against the live Pod. That avoids mounting the RWO PVC from a second pod,
which would Multi-Attach on Cinder.

Scope: namespace-local, minimum-needed verbs.

Only rendered when something that uses it is enabled — the occ-cron CronJob or
the DB-migrate Job. Without either, these RBAC objects are dead weight (and
require cluster RBAC-create permission the installer may not have).
*/}}
{{- if or .Values.nextcloud.cronJob.enabled .Values.nextcloud.dbMigrateJob.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-occ
  labels:
    {{- include "nextcloud-stack.nextcloud.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-occ
  labels:
    {{- include "nextcloud-stack.nextcloud.labels" . | nindent 4 }}
rules:
  # `kubectl rollout status` needs watch on deployments; resourceNames is
  # incompatible with watch, so we can't pin to a single deployment. The
  # risk is being able to LIST other deployments in this namespace —
  # informational, not exfiltration-grade.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    # patch: the db-migrate Job's restart-on-fresh-app-install
    # (`kubectl rollout restart`, see dbMigrateJob.restartOnAppInstall).
    verbs: ["get", "list", "watch", "patch"]
  # `kubectl exec deploy/...` discovers the target pod via the Deployment's
  # selector — pod names are non-stable so resourceNames doesn't help here.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Exec into the live pod — this is the real blast radius for the SA.
  # `kubectl exec` POSTs to the exec subresource (create); no other verb
  # is exercised by the cron/migrate scripts.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-occ
  labels:
    {{- include "nextcloud-stack.nextcloud.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "nextcloud-stack.fullname" . }}-occ
subjects:
  - kind: ServiceAccount
    name: {{ include "nextcloud-stack.fullname" . }}-occ
    namespace: {{ .Release.Namespace }}
{{- end }}
