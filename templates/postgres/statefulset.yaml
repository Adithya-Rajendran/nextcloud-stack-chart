{{- if .Values.postgres.enabled }}
{{/*
Postgres StatefulSet. Single replica, RWO Cinder, retain SC. Stable name
matters because Nextcloud's connection string points at this pod by DNS.

Bootstrap is env-only (no /docker-entrypoint-initdb.d — the DHI image ignores
it). With manageAppRole the instance bootstraps with a dedicated `postgres`
superuser and the app role/database are created by the nextcloud Pod's
wait-for-postgres init container; without it, the app user is the bootstrap
superuser (legacy).
*/}}
{{- include "nextcloud-stack.requireSecret" (dict "existing" .Values.postgres.auth.existingSecret "section" "postgres.auth") -}}
{{- if and .Values.postgres.auth.manageAppRole (or (eq .Values.postgres.auth.username "postgres") (eq .Values.postgres.auth.database "postgres")) -}}
{{- fail "postgres.auth.manageAppRole reserves the name 'postgres' for the admin role and maintenance database. Set postgres.auth.username/database to something else (default: nextcloud), or set manageAppRole=false." -}}
{{- end -}}
{{- $fullname := include "nextcloud-stack.postgres.fullname" . -}}
{{- $dbSecret := include "nextcloud-stack.secretName" (dict "existing" .Values.postgres.auth.existingSecret "default" (printf "%s-postgres" (include "nextcloud-stack.fullname" .))) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "nextcloud-stack.postgres.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fullname }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "nextcloud-stack.postgres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nextcloud-stack.postgres.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "nextcloud-stack.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      # Postgres shutdown writes a checkpoint; on a busy DB or slow Cinder
      # the default 30s can SIGKILL mid-checkpoint, triggering recovery on
      # the next boot. 60s covers the realistic shutdown window.
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- toYaml .Values.postgres.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: {{ include "nextcloud-stack.image" .Values.postgres.image }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.postgres.containerSecurityContext | nindent 12 }}
          env:
{{- if .Values.postgres.auth.manageAppRole }}
            # Privilege separation: bootstrap the instance with a dedicated
            # `postgres` superuser via the upstream POSTGRES_* env vars (works on
            # both the public image and the DHI overlay — DHI's postgres doesn't
            # honor /docker-entrypoint-initdb.d/). The app role + database are
            # created/enforced by the nextcloud Pod's wait-for-postgres init
            # container (NOSUPERUSER, owns ONLY its database — DB ownership
            # covers the Postgres-15+ public-schema permission). POSTGRES_* env
            # is only read on first initdb; on existing data dirs the init
            # container migrates the legacy app-user-as-superuser layout.
            # POSTGRES_USER is also what backup.sh dumps as (pg_dumpall needs
            # the superuser).
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $dbSecret }}, key: postgres-admin-password } }
{{- else }}
            # Legacy single-role bootstrap: the app user IS the instance
            # superuser and owns the database + public schema. Discouraged —
            # see postgres.auth.manageAppRole in values.yaml.
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $dbSecret }}, key: nextcloud-db-password } }
{{- end }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.service.port }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.auth.username }}", "-d", "{{ .Values.postgres.auth.database }}"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.auth.username }}", "-d", "{{ .Values.postgres.auth.database }}"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.auth.username }}", "-d", "{{ .Values.postgres.auth.database }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60     # 5 min for initdb on first install
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: run
          emptyDir: { sizeLimit: 64Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
        # selectorLabels ONLY — volumeClaimTemplates metadata is immutable, so a
        # version-varying label (helm.sh/chart, app.kubernetes.io/version) here
        # makes every chart bump a forbidden STS update (broke the 0.2.0→0.3.0
        # upgrade in the field).
        labels:
          {{- include "nextcloud-stack.postgres.selectorLabels" . | nindent 10 }}
        annotations:
          # PVC outlives the StatefulSet — explicit delete required to drop data.
          helm.sh/resource-policy: keep
      spec:
        accessModes:
          {{- range .Values.postgres.persistence.accessModes }}
          - {{ . }}
          {{- end }}
        storageClassName: {{ .Values.postgres.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
{{- end }}
