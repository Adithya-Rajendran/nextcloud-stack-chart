{{- if .Values.clamav.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nextcloud-stack.clamav.fullname" . }}
  labels:
    {{- include "nextcloud-stack.clamav.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nextcloud-stack.clamav.selectorLabels" . | nindent 4 }}
  ports:
    - name: clamd
      port: {{ .Values.clamav.service.port }}
      targetPort: {{ .Values.clamav.service.port }}
      protocol: TCP
{{- end }}
