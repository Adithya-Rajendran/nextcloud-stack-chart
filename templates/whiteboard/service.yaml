{{- if .Values.whiteboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nextcloud-stack.whiteboard.fullname" . }}
  labels:
    {{- include "nextcloud-stack.whiteboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  # Cheap affinity backstop. The websocket client connects directly (transports:
  # ['websocket'], no long-poll handshake to pin) and the Valkey adapter fans out
  # across replicas, so this is not load-bearing for HA.
  sessionAffinity: ClientIP
  selector:
    {{- include "nextcloud-stack.whiteboard.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.whiteboard.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
