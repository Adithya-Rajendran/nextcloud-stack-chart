{{- if .Values.networkPolicy.enabled }}
{{/*
NetworkPolicies — default-deny + per-component allows.

Public exposure ⇒ NetworkPolicies are part of the threat model. These restrict
which pods can talk to which others, preventing a compromised sidecar (or
operator-bot) in another namespace from reaching the database directly.

The chart assumes Cilium semantics; standard NetworkPolicy v1 syntax is used
so any conformant CNI (Calico, Cilium, etc.) will enforce them.
*/}}

# ---- default-deny in this namespace -----------------------------------------
# Excludes the kubectl-using pods (cron, db-migrate). Those need to reach
# the kube-apiserver, which Cilium classifies as the `kube-apiserver` entity
# and NetworkPolicy v1 ipBlock rules don't apply to. Their RBAC scope
# (pods/exec on nextcloud Deployment only) is the actual security constraint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-default-deny
  labels:
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: ["nextcloud-cron", "nextcloud-db-migrate"]
  policyTypes:
    - Ingress
    - Egress

---
# ---- Nextcloud: ingress from configured sources, egress to deps + DNS + net --
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nextcloud-stack.nextcloud.fullname" . }}
  labels:
    {{- include "nextcloud-stack.nextcloud.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Sources allowed to reach Nextcloud on the HTTP port. Populate
    # networkPolicy.nextcloudIngressFrom with your ingress controller / gateway
    # (raw NetworkPolicyPeer entries); the Cloudflare addon adds its own source
    # automatically. `kubectl exec` from the cron/migrate Jobs does NOT need a
    # rule here — exec traffic goes apiserver -> kubelet -> pod, not through the
    # Service, and is not constrained by NetworkPolicy on the pod-to-pod path.
{{- range .Values.networkPolicy.nextcloudIngressFrom }}
    - from:
        {{- toYaml (list .) | nindent 8 }}
      ports:
        - port: {{ $.Values.nextcloud.service.targetPort }}
          protocol: TCP
{{- end }}
{{- if .Values.cloudflare.enabled }}
    # Cloudflare addon: allow the cloudflared pods.
    - from:
  {{- if .Values.cloudflare.tunnel.enabled }}
        # cloudflared deployed by this chart (same namespace).
        - podSelector:
            matchLabels:
              {{- include "nextcloud-stack.cloudflared.selectorLabels" . | nindent 14 }}
  {{- else }}
        # cloudflared run externally.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.cloudflare.externalTunnel.namespace }}
          podSelector:
            matchLabels:
              {{ .Values.cloudflare.externalTunnel.podLabel.key }}: {{ .Values.cloudflare.externalTunnel.podLabel.value }}
  {{- end }}
      ports:
        - port: {{ .Values.nextcloud.service.targetPort }}
          protocol: TCP
{{- end }}
{{- if .Values.tests.enabled }}
    # helm-test pod hits /status.php on the Service. Narrow rule on 8080 only.
    - from:
        - podSelector:
            matchLabels:
              {{- include "nextcloud-stack.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: test
      ports:
        - port: {{ .Values.nextcloud.service.targetPort }}
          protocol: TCP
{{- end }}
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Postgres
    - to:
        - podSelector:
            matchLabels:
              {{- include "nextcloud-stack.postgres.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.postgres.service.port }}
          protocol: TCP
    # Valkey
    {{- if .Values.valkey.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "nextcloud-stack.valkey.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.valkey.service.port }}
          protocol: TCP
    {{- end }}
    # ClamAV
    {{- if .Values.clamav.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "nextcloud-stack.clamav.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.clamav.service.port }}
          protocol: TCP
    {{- end }}
    # Whiteboard backend (server-side calls from the whiteboard app)
    {{- if .Values.whiteboard.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "nextcloud-stack.whiteboard.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.whiteboard.service.port }}
          protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.allowAllEgress }}
    # Public internet (app updates, federation, etc.). Lock down by setting
    # networkPolicy.allowAllEgress: false. The `except` block keeps in-cluster
    # traffic on the explicit per-Service rules above — see
    # networkPolicy.inClusterCidrs.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.networkPolicy.inClusterCidrs }}
              - {{ . }}
              {{- end }}
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
    {{- end }}

---
# ---- Postgres: ingress from Nextcloud only ---------------------------------
{{- if .Values.postgres.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nextcloud-stack.postgres.fullname" . }}
  labels:
    {{- include "nextcloud-stack.postgres.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nextcloud-stack.postgres.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # From the Nextcloud pod.
    - from:
        - podSelector:
            matchLabels:
              {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.postgres.service.port }}
          protocol: TCP
  # No egress rules — single-replica postgres doesn't initiate connections.
  # `Egress` is kept in policyTypes so absence-of-rules means deny-all even
  # if the default-deny policy is ever removed.
{{- end }}

---
# ---- Valkey: ingress from Nextcloud only -----------------------------------
{{- if .Values.valkey.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nextcloud-stack.valkey.fullname" . }}
  labels:
    {{- include "nextcloud-stack.valkey.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nextcloud-stack.valkey.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.valkey.service.port }}
          protocol: TCP
    {{- if .Values.whiteboard.enabled }}
    # Whiteboard's Socket.IO Redis-Streams adapter (shared HA board state).
    - from:
        - podSelector:
            matchLabels:
              {{- include "nextcloud-stack.whiteboard.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.valkey.service.port }}
          protocol: TCP
    {{- end }}
  # No egress rules — Valkey is daemon-only. See postgres policy comment.
{{- end }}

---
# ---- ClamAV: ingress from Nextcloud, egress to internet for freshclam ------
{{- if .Values.clamav.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nextcloud-stack.clamav.fullname" . }}
  labels:
    {{- include "nextcloud-stack.clamav.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nextcloud-stack.clamav.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.clamav.service.port }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # freshclam pulls signatures from public mirrors.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.networkPolicy.inClusterCidrs }}
              - {{ . }}
              {{- end }}
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
{{- end }}

---
# ---- Whiteboard: ingress from proxy/Nextcloud; egress to DNS+Nextcloud+Valkey -
{{- if .Values.whiteboard.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nextcloud-stack.whiteboard.fullname" . }}
  labels:
    {{- include "nextcloud-stack.whiteboard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nextcloud-stack.whiteboard.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Browsers reach the whiteboard backend directly through the same proxy as
    # Nextcloud, so reuse whiteboardIngressFrom (defaults to nextcloudIngressFrom).
    # NOTE: with the Cilium Gateway/Ingress this is NOT enough on its own — the
    # gateway's proxied traffic uses the reserved 'ingress' identity, which v1
    # NetworkPolicy can't select. Pair with a CiliumNetworkPolicy fromEntities:
    # [ingress] (see README) when fronting via the Cilium gateway.
{{- range (.Values.networkPolicy.whiteboardIngressFrom | default .Values.networkPolicy.nextcloudIngressFrom) }}
    - from:
        {{- toYaml (list .) | nindent 8 }}
      ports:
        - port: {{ $.Values.whiteboard.service.port }}
          protocol: TCP
{{- end }}
{{- if .Values.cloudflare.enabled }}
    - from:
  {{- if .Values.cloudflare.tunnel.enabled }}
        - podSelector:
            matchLabels:
              {{- include "nextcloud-stack.cloudflared.selectorLabels" . | nindent 14 }}
  {{- else }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.cloudflare.externalTunnel.namespace }}
          podSelector:
            matchLabels:
              {{ .Values.cloudflare.externalTunnel.podLabel.key }}: {{ .Values.cloudflare.externalTunnel.podLabel.value }}
  {{- end }}
      ports:
        - port: {{ .Values.whiteboard.service.port }}
          protocol: TCP
{{- end }}
    # Nextcloud server-side calls to the backend.
    - from:
        - podSelector:
            matchLabels:
              {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.whiteboard.service.port }}
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Nextcloud (JWT verification / API)
    - to:
        - podSelector:
            matchLabels:
              {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.nextcloud.service.targetPort }}
          protocol: TCP
    {{- if .Values.valkey.enabled }}
    # Valkey (shared HA board state)
    - to:
        - podSelector:
            matchLabels:
              {{- include "nextcloud-stack.valkey.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.valkey.service.port }}
          protocol: TCP
    {{- end }}
{{- end }}

---
# ---- cloudflared: no ingress, egress to DNS + Nextcloud + Cloudflare edge ---
{{- if and .Values.cloudflare.enabled .Values.cloudflare.tunnel.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nextcloud-stack.cloudflared.fullname" . }}
  labels:
    {{- include "nextcloud-stack.cloudflared.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nextcloud-stack.cloudflared.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # No ingress — cloudflared dials out to the Cloudflare edge.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # The Nextcloud Service (origin).
    - to:
        - podSelector:
            matchLabels:
              {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.nextcloud.service.targetPort }}
          protocol: TCP
    # The Cloudflare edge (HTTPS + QUIC on 7844).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.networkPolicy.inClusterCidrs }}
              - {{ . }}
              {{- end }}
      ports:
        - { port: 443,  protocol: TCP }
        - { port: 7844, protocol: TCP }
        - { port: 7844, protocol: UDP }
{{- end }}

---
# ---- helm-test: egress to DNS + Nextcloud Service only ---------------------
# Sticky policy (not a hook) so `helm test` can be re-run without races. The
# test Pod itself is a hook with delete-on-success; this NP stays.
{{- if .Values.tests.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-test
  labels:
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
spec:
  podSelector:
    matchLabels:
      {{- include "nextcloud-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: test
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.nextcloud.service.targetPort }}
          protocol: TCP
{{- end }}
{{- end }}
