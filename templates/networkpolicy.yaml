{{- if .Values.networkPolicy.enabled }}
{{/*
CiliumNetworkPolicy — default-deny + per-component allows.

This chart uses CiliumNetworkPolicy (cilium.io/v2), NOT standard NetworkPolicy.
Rationale: under Cilium's Gateway/Ingress the proxied traffic carries the
reserved `ingress` identity, which standard NetworkPolicy v1 cannot select — so
a gateway-fronted install 503s with a v1 policy. Cilium-native policy also lets
us write `toEntities: [world]` (clean public-internet egress) and `fromEntities:
[ingress]` (exactly the gateway proxy) instead of CIDR/identity hacks.

REQUIRES Cilium. On another CNI set networkPolicy.enabled=false and bring your
own policy. See README "Network policy (Cilium)".

`*IngressFrom` values are now raw Cilium ingress selectors (fromEndpoints /
fromEntities / fromCIDRSet), e.g.
  nextcloudIngressFrom:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: ingress-nginx }
*/}}

# ---- catch-all default-deny -------------------------------------------------
# Selects every pod EXCEPT the kubectl-using Jobs (cron, db-migrate); those
# reach the kube-apiserver and are constrained by RBAC (pods/exec on the
# nextcloud Deployment only), not by network policy. Empty ingress + egress
# arrays select these endpoints for enforcement with ZERO allows = default-deny
# in both directions; the per-component policies below union in the allows (so
# this also supplies the egress-deny for the ingress-only component policies).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-default-deny
  labels:
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: ["nextcloud-cron", "nextcloud-db-migrate"]
  ingress: []
  egress: []

---
# ---- Nextcloud: ingress from configured sources + gateway; egress to deps -----
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "nextcloud-stack.nextcloud.fullname" . }}
  labels:
    {{- include "nextcloud-stack.nextcloud.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 6 }}
  ingress:
{{- if .Values.gatewayApi.enabled }}
    # Cilium Gateway / Ingress proxy (reserved `ingress` identity). This is the
    # rule standard NetworkPolicy can't express.
    - fromEntities: [ingress]
      toPorts:
        - ports: [{ port: {{ .Values.nextcloud.service.targetPort | quote }}, protocol: TCP }]
{{- end }}
{{- range .Values.networkPolicy.nextcloudIngressFrom }}
    -
{{ toYaml . | indent 6 }}
      toPorts:
        - ports: [{ port: {{ $.Values.nextcloud.service.targetPort | quote }}, protocol: TCP }]
{{- end }}
{{- if .Values.cloudflare.enabled }}
    # Cloudflare addon: the cloudflared pods.
{{- if .Values.cloudflare.tunnel.enabled }}
    - fromEndpoints:
        - matchLabels:
            {{- include "nextcloud-stack.cloudflared.selectorLabels" . | nindent 12 }}
{{- else }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.cloudflare.externalTunnel.namespace }}
            {{ .Values.cloudflare.externalTunnel.podLabel.key }}: {{ .Values.cloudflare.externalTunnel.podLabel.value }}
{{- end }}
      toPorts:
        - ports: [{ port: {{ .Values.nextcloud.service.targetPort | quote }}, protocol: TCP }]
{{- end }}
{{- if .Values.tests.enabled }}
    # helm-test pod hits /status.php on the Service.
    - fromEndpoints:
        - matchLabels:
            {{- include "nextcloud-stack.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: test
      toPorts:
        - ports: [{ port: {{ .Values.nextcloud.service.targetPort | quote }}, protocol: TCP }]
{{- end }}
{{- if .Values.metrics.enabled }}
    # Metrics exporter scraping the serverinfo API.
    - fromEndpoints:
        - matchLabels:
            {{- include "nextcloud-stack.metrics.selectorLabels" . | nindent 12 }}
      toPorts:
        - ports: [{ port: {{ .Values.nextcloud.service.targetPort | quote }}, protocol: TCP }]
{{- end }}
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    # Postgres
    - toEndpoints:
        - matchLabels:
            {{- include "nextcloud-stack.postgres.selectorLabels" . | nindent 12 }}
      toPorts:
        - ports: [{ port: {{ .Values.postgres.service.port | quote }}, protocol: TCP }]
{{- if .Values.valkey.enabled }}
    # Valkey
    - toEndpoints:
        - matchLabels:
            {{- include "nextcloud-stack.valkey.selectorLabels" . | nindent 12 }}
      toPorts:
        - ports: [{ port: {{ .Values.valkey.service.port | quote }}, protocol: TCP }]
{{- end }}
{{- if .Values.clamav.enabled }}
    # ClamAV
    - toEndpoints:
        - matchLabels:
            {{- include "nextcloud-stack.clamav.selectorLabels" . | nindent 12 }}
      toPorts:
        - ports: [{ port: {{ .Values.clamav.service.port | quote }}, protocol: TCP }]
{{- end }}
{{- if .Values.whiteboard.enabled }}
    # Whiteboard backend (server-side calls from the whiteboard app)
    - toEndpoints:
        - matchLabels:
            {{- include "nextcloud-stack.whiteboard.selectorLabels" . | nindent 12 }}
      toPorts:
        - ports: [{ port: {{ .Values.whiteboard.service.port | quote }}, protocol: TCP }]
{{- end }}
{{- if .Values.networkPolicy.allowAllEgress }}
    # Public internet (app updates, federation, etc.) — everything OUTSIDE the
    # cluster. `world` is exactly that; in-cluster stays on the rules above.
    # Lock down by setting networkPolicy.allowAllEgress: false.
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }, { port: "80", protocol: TCP }]
{{- end }}

---
# ---- Postgres: ingress from Nextcloud only (egress denied by catch-all) ------
{{- if .Values.postgres.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "nextcloud-stack.postgres.fullname" . }}
  labels:
    {{- include "nextcloud-stack.postgres.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "nextcloud-stack.postgres.selectorLabels" . | nindent 6 }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 12 }}
      toPorts:
        - ports: [{ port: {{ .Values.postgres.service.port | quote }}, protocol: TCP }]
{{- end }}

---
# ---- Valkey: ingress from Nextcloud (+ Whiteboard) only ---------------------
{{- if .Values.valkey.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "nextcloud-stack.valkey.fullname" . }}
  labels:
    {{- include "nextcloud-stack.valkey.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "nextcloud-stack.valkey.selectorLabels" . | nindent 6 }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 12 }}
{{- if .Values.whiteboard.enabled }}
        # Whiteboard's Socket.IO Redis-Streams adapter (shared HA board state).
        - matchLabels:
            {{- include "nextcloud-stack.whiteboard.selectorLabels" . | nindent 12 }}
{{- end }}
      toPorts:
        - ports: [{ port: {{ .Values.valkey.service.port | quote }}, protocol: TCP }]
{{- end }}

---
# ---- ClamAV: ingress from Nextcloud; egress to DNS + freshclam mirrors ------
{{- if .Values.clamav.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "nextcloud-stack.clamav.fullname" . }}
  labels:
    {{- include "nextcloud-stack.clamav.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "nextcloud-stack.clamav.selectorLabels" . | nindent 6 }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 12 }}
      toPorts:
        - ports: [{ port: {{ .Values.clamav.service.port | quote }}, protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    # freshclam pulls signatures from public mirrors (outside the cluster).
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }, { port: "80", protocol: TCP }]
{{- end }}

---
# ---- Whiteboard: ingress from proxy/Nextcloud; egress DNS+Nextcloud+Valkey --
{{- if .Values.whiteboard.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "nextcloud-stack.whiteboard.fullname" . }}
  labels:
    {{- include "nextcloud-stack.whiteboard.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "nextcloud-stack.whiteboard.selectorLabels" . | nindent 6 }}
  ingress:
{{- if .Values.gatewayApi.enabled }}
    # Browsers reach the whiteboard backend through the Cilium gateway proxy.
    - fromEntities: [ingress]
      toPorts:
        - ports: [{ port: {{ .Values.whiteboard.service.port | quote }}, protocol: TCP }]
{{- end }}
{{- range (.Values.networkPolicy.whiteboardIngressFrom | default .Values.networkPolicy.nextcloudIngressFrom) }}
    -
{{ toYaml . | indent 6 }}
      toPorts:
        - ports: [{ port: {{ $.Values.whiteboard.service.port | quote }}, protocol: TCP }]
{{- end }}
{{- if .Values.cloudflare.enabled }}
{{- if .Values.cloudflare.tunnel.enabled }}
    - fromEndpoints:
        - matchLabels:
            {{- include "nextcloud-stack.cloudflared.selectorLabels" . | nindent 12 }}
{{- else }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.cloudflare.externalTunnel.namespace }}
            {{ .Values.cloudflare.externalTunnel.podLabel.key }}: {{ .Values.cloudflare.externalTunnel.podLabel.value }}
{{- end }}
      toPorts:
        - ports: [{ port: {{ .Values.whiteboard.service.port | quote }}, protocol: TCP }]
{{- end }}
    # Nextcloud server-side calls to the backend.
    - fromEndpoints:
        - matchLabels:
            {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 12 }}
      toPorts:
        - ports: [{ port: {{ .Values.whiteboard.service.port | quote }}, protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    # Nextcloud (JWT verification / API)
    - toEndpoints:
        - matchLabels:
            {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 12 }}
      toPorts:
        - ports: [{ port: {{ .Values.nextcloud.service.targetPort | quote }}, protocol: TCP }]
{{- if .Values.valkey.enabled }}
    # Valkey (shared HA board state)
    - toEndpoints:
        - matchLabels:
            {{- include "nextcloud-stack.valkey.selectorLabels" . | nindent 12 }}
      toPorts:
        - ports: [{ port: {{ .Values.valkey.service.port | quote }}, protocol: TCP }]
{{- end }}
{{- end }}

---
# ---- cloudflared: no ingress; egress to DNS + Nextcloud + Cloudflare edge ---
{{- if and .Values.cloudflare.enabled .Values.cloudflare.tunnel.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "nextcloud-stack.cloudflared.fullname" . }}
  labels:
    {{- include "nextcloud-stack.cloudflared.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "nextcloud-stack.cloudflared.selectorLabels" . | nindent 6 }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    # The Nextcloud origin.
    - toEndpoints:
        - matchLabels:
            {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 12 }}
      toPorts:
        - ports: [{ port: {{ .Values.nextcloud.service.targetPort | quote }}, protocol: TCP }]
    # The Cloudflare edge (HTTPS + QUIC on 7844), outside the cluster.
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }, { port: "7844", protocol: TCP }, { port: "7844", protocol: UDP }]
{{- end }}

---
# ---- helm-test: egress to DNS + Nextcloud only -----------------------------
{{- if .Values.tests.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-test
  labels:
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
spec:
  endpointSelector:
    matchLabels:
      {{- include "nextcloud-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: test
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 12 }}
      toPorts:
        - ports: [{ port: {{ .Values.nextcloud.service.targetPort | quote }}, protocol: TCP }]
{{- end }}

---
# ---- backup: egress to the kube-apiserver (kubectl exec) + DNS -------------
{{- if .Values.backup.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "nextcloud-stack.backup.fullname" . }}
  labels:
    {{- include "nextcloud-stack.backup.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "nextcloud-stack.backup.selectorLabels" . | nindent 6 }}
  egress:
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
{{- end }}

---
# ---- metrics exporter: ingress from the scraper(s); egress DNS + Nextcloud ---
# Ingress sources come from networkPolicy.metricsIngressFrom (raw Cilium
# selectors — typically the Prometheus namespace). Empty ⇒ no scraper allowed
# (the default-deny catch-all blocks it); set it so Prometheus can reach :9205.
{{- if .Values.metrics.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "nextcloud-stack.metrics.fullname" . }}
  labels:
    {{- include "nextcloud-stack.metrics.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "nextcloud-stack.metrics.selectorLabels" . | nindent 6 }}
{{- with .Values.networkPolicy.metricsIngressFrom }}
  ingress:
{{- range . }}
    -
{{ toYaml . | indent 6 }}
      toPorts:
        - ports: [{ port: {{ $.Values.metrics.service.port | quote }}, protocol: TCP }]
{{- end }}
{{- end }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    # Nextcloud serverinfo API.
    - toEndpoints:
        - matchLabels:
            {{- include "nextcloud-stack.nextcloud.selectorLabels" . | nindent 12 }}
      toPorts:
        - ports: [{ port: {{ .Values.nextcloud.service.targetPort | quote }}, protocol: TCP }]
{{- end }}
{{- end }}
